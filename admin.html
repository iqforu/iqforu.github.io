<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>IQ FOR U – Admin</title>
<style>
  :root{ --navy:#14213d; --navy2:#1f3a8a; --gold:#e0a526; --gold-soft:#fdf3dc; --bg:#f3f5fa; --ink:#14213d; --muted:#5b6475; --line:#dde2ec;
         --ok:#14804a; --ok-soft:#e6f5ec; --bad:#c0392b; --bad-soft:#fdecec; --r:14px; --sh:0 4px 18px rgba(20,33,61,.08); }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  button{font:inherit;cursor:pointer}
  .top{background:var(--navy);color:#fff}
  .top .in{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
  .brand{font-weight:800;font-size:19px} .brand span{color:var(--gold)} .sp{flex:1}
  .wrap{max-width:1100px;margin:auto;padding:16px}
  .card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
  .btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;background:var(--navy2);color:#fff;display:inline-flex;align-items:center;gap:6px}
  .btn.gold{background:var(--gold);color:var(--navy)} .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)} .btn.red{background:var(--bad)}
  .btn.sm{padding:6px 11px;font-size:13.5px} .btn:disabled{opacity:.5;cursor:not-allowed}
  .top .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
  h2{margin:0 0 10px;font-size:19px} h3{margin:0 0 6px}
  label{display:block;font-weight:600;font-size:13.5px;margin:10px 0 4px}
  input,textarea,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font:inherit}
  textarea{min-height:190px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;white-space:pre}
  .row{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .msg{padding:10px 12px;border-radius:10px;margin-top:10px;font-size:14px}
  .msg.err{background:var(--bad-soft);color:var(--bad)} .msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.info{background:var(--gold-soft);color:#7a4b00}
  table{width:100%;border-collapse:collapse;font-size:13.5px} th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} th{font-size:12px;color:var(--muted)}
  td.n,th.n{text-align:right}
  .tbl{overflow-x:auto}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef0f4;color:#555}
  .c-ok{background:var(--ok-soft);color:var(--ok)} .c-up{background:var(--gold-soft);color:#8a5a00} .c-bad{background:var(--bad-soft);color:var(--bad)} .c-blue{background:#e8eefc;color:var(--navy2)}
  .acts{display:flex;flex-wrap:wrap;gap:6px}
  .muted{color:var(--muted)} .small{font-size:13px}
  .check{display:flex;align-items:center;gap:8px;font-weight:600;margin-top:12px} .check input{width:auto}
</style>
</head>
<body>
<header class="top"><div class="in"><div class="brand">IQ <span>FOR</span> U · Admin</div><div class="sp"></div>
  <span id="who" class="small"></span><button class="btn ghost sm" id="authBtn" type="button">Login</button></div></header>
<main class="wrap" id="app"><div class="card muted">Loading…</div></main>

<script type="module">
import { firebaseConfig } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, getDocs, writeBatch, serverTimestamp, Timestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms = t => t && typeof t.toMillis === 'function' ? t.toMillis() : (t instanceof Date ? t.getTime() : Number(t) || 0);
const fmtDT = t => new Date(ms(t)).toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'numeric', minute:'2-digit', hour12:true });
const toLocalInput = t => { const d = new Date(ms(t)); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const r2 = v => Math.round(v * 100) / 100;
const errText = e => { const c = (e && e.code) || ''; if (c.includes('permission-denied')) return 'Permission denied. Is this Gmail in the Firestore Rules admin list?'; return (e && e.message) || String(e); };

let USER = null, EXAMS = [];

$('#authBtn').onclick = async () => {
  if (USER) return signOut(auth);
  try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { alert(errText(e)); }
};
onAuthStateChanged(auth, async u => {
  USER = u; $('#authBtn').textContent = u ? 'Logout' : 'Login'; $('#who').textContent = u ? u.email : '';
  if (!u) { $('#app').innerHTML = '<div class="card"><h2>Admin login</h2><p class="muted">Login with the admin Gmail.</p></div>'; return; }
  list();
});

// ------------------------------------------------------------------ exam list
async function list() {
  $('#app').innerHTML = '<div class="card muted">Loading exams…</div>';
  try { const s = await getDocs(collection(db, 'exams')); EXAMS = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => ms(b.startAt) - ms(a.startAt)); }
  catch (e) { $('#app').innerHTML = `<div class="card"><h2>Not an admin</h2><div class="msg err">${esc(errText(e))}</div><p class="small muted">Logged in as ${esc(USER.email)}.</p></div>`; return; }
  const st = x => { const t = Date.now();
    if (!x.published) return '<span class="chip">Draft (hidden)</span>';
    if (t < ms(x.startAt)) return '<span class="chip c-up">Upcoming</span>';
    if (t <= ms(x.endAt)) return '<span class="chip c-ok">LIVE</span>';
    return x.resultsOut ? '<span class="chip c-blue">Result published</span>' : '<span class="chip c-bad">Closed – publish result</span>'; };
  $('#app').innerHTML = `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0">Mock tests (${EXAMS.length})</h2><button class="btn gold" id="new" type="button">＋ New mock test</button></div></div>
    ${EXAMS.length ? EXAMS.map(x => `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div><h3>${esc(x.title)}</h3><div class="small muted">${esc(fmtDT(x.startAt))} → ${esc(fmtDT(x.endAt))} · ${x.count} Q · ${x.total} marks · ${x.duration} min · −${x.neg}</div></div>
      <div>${st(x)}</div></div>
      <div class="acts" style="margin-top:10px">
        <button class="btn sm" data-edit="${esc(x.id)}" type="button">✏️ Edit</button>
        <button class="btn sm ghost" data-att="${esc(x.id)}" type="button">👥 Attempts</button>
        <button class="btn sm gold" data-res="${esc(x.id)}" type="button">🏆 Results</button>
      </div></div>`).join('') : '<div class="card muted">No mock tests yet. Click "New mock test".</div>'}`;
  $('#new').onclick = () => edit(null);
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => edit(b.dataset.edit));
  document.querySelectorAll('[data-att]').forEach(b => b.onclick = () => attempts(b.dataset.att));
  document.querySelectorAll('[data-res]').forEach(b => b.onclick = () => results(b.dataset.res));
}

// ------------------------------------------------------------------ paste parser (Excel → TSV)
function parseTSV(text) {
  const rows = []; let row = [], f = '', q = false;
  text = text.replace(/\r\n?/g, '\n');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"' && f === '') q = true;
    else if (c === '\t') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
function toQuestions(text) {
  const rows = parseTSV(text), out = [], errs = [];
  rows.forEach((r, i) => {
    const c = r.map(x => String(x).trim());
    if (i === 0 && /section/i.test(c[0]) && /answer/i.test(c[c.length - 1] || '')) return;   // header row
    if (c.length < 8) { errs.push(`Row ${i + 1}: needs 8 columns (Section, Topic, Question, A, B, C, D, Answer) – found ${c.length}`); return; }
    let ans = c[7].toUpperCase().replace(/[^A-D1-4]/g, '');
    if (/^[1-4]$/.test(ans)) ans = 'ABCD'[+ans - 1];
    if (!/^[A-D]$/.test(ans)) { errs.push(`Row ${i + 1}: Answer must be A, B, C or D – found "${c[7]}"`); return; }
    if (!c[2]) { errs.push(`Row ${i + 1}: Question is empty`); return; }
    if (c.slice(3, 7).some(o => o === '')) { errs.push(`Row ${i + 1}: an option is empty`); return; }
    out.push({ sec: c[0] || 'General', topic: c[1], q: c[2], o: c.slice(3, 7), ans });
  });
  return { qs: out, errs };
}
function toTSV(qs, key) {
  const cell = v => { v = String(v ?? ''); return /[\t\n"]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return ['Section\tTopic\tQuestion\tA\tB\tC\tD\tAnswer'].concat(qs.map(q => [q.sec, q.topic, q.q, ...q.o, key[q.id] || ''].map(cell).join('\t'))).join('\n');
}

// ------------------------------------------------------------------ create / edit
async function edit(id) {
  const x = id ? EXAMS.find(e => e.id === id) : null;
  let tsv = '';
  if (x) {
    try {
      const [p, k] = await Promise.all([getDoc(doc(db, 'exams', id, 'paper', 'main')), getDoc(doc(db, 'keys', id))]);
      tsv = toTSV(p.exists() ? p.data().questions : [], k.exists() ? k.data().ans : {});
    } catch (e) { alert(errText(e)); }
  }
  const d = new Date(); d.setDate(d.getDate() + ((7 - d.getDay()) % 7 || 7)); d.setHours(6, 0, 0, 0);   // next Sunday 6 AM
  const e2 = new Date(d); e2.setHours(22, 0, 0, 0);
  $('#app').innerHTML = `<div class="card"><button class="btn ghost sm" id="bk" type="button">← Back</button>
    <h2 style="margin-top:12px">${x ? 'Edit mock test' : 'New mock test'}</h2>
    <label for="ti">Title</label><input id="ti" maxlength="90" value="${esc(x ? x.title : 'IQ FOR U Weekly Mock – ')}">
    <label for="de">Short description (optional)</label><input id="de" maxlength="160" value="${esc(x ? x.desc || '' : 'Maths · Reasoning · Computer · OSSSC previous papers')}">
    <div class="row">
      <div><label for="sa">Opens (start)</label><input id="sa" type="datetime-local" value="${toLocalInput(x ? x.startAt : d)}"></div>
      <div><label for="ea">Closes (end)</label><input id="ea" type="datetime-local" value="${toLocalInput(x ? x.endAt : e2)}"></div>
      <div><label for="du">Time per student (minutes)</label><input id="du" type="number" min="5" max="300" value="${x ? x.duration : 60}"></div>
      <div><label for="mk">Marks per correct</label><input id="mk" type="number" step="0.25" min="0.25" value="${x ? x.mark : 1}"></div>
      <div><label for="ng">Negative per wrong</label><input id="ng" type="number" step="0.05" min="0" value="${x ? x.neg : 0.25}"></div>
    </div>
    <p class="small muted">Students can start any time between Opens and Closes. Each student gets the full time, but the test always ends at Closes.</p>
    <label for="qs">Questions – copy from Excel and paste here (8 columns: Section | Topic | Question | A | B | C | D | Answer)</label>
    <textarea id="qs" spellcheck="false" placeholder="Maths\tRatio\tThe ratio of ...\t10\t20\t30\t40\tB">${esc(tsv)}</textarea>
    <div id="pv" class="small"></div>
    <label class="check"><input type="checkbox" id="pb" ${x && x.published ? 'checked' : ''}> Published (students can see this test on the home page)</label>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn gold" id="sv" type="button">💾 Save</button></div>
    <div id="sm"></div></div>`;
  $('#bk').onclick = list;
  const preview = () => {
    const { qs, errs } = toQuestions($('#qs').value), secs = {}, ans = { A: 0, B: 0, C: 0, D: 0 };
    qs.forEach(q => { secs[q.sec] = (secs[q.sec] || 0) + 1; ans[q.ans]++; });
    $('#pv').innerHTML = `<div class="msg ${errs.length ? 'err' : (qs.length ? 'ok' : 'info')}"><b>${qs.length}</b> questions · ${Object.keys(secs).map(k => `${esc(k)} ${secs[k]}`).join(' · ') || '—'} · Answers A${ans.A} B${ans.B} C${ans.C} D${ans.D}
      ${errs.length ? '<br>' + errs.slice(0, 8).map(esc).join('<br>') + (errs.length > 8 ? `<br>… ${errs.length - 8} more` : '') : ''}</div>`;
    return { qs, errs };
  };
  $('#qs').oninput = preview; preview();
  $('#sv').onclick = async () => {
    const { qs, errs } = preview(), m = $('#sm');
    const title = $('#ti').value.trim(), sa = new Date($('#sa').value), ea = new Date($('#ea').value);
    const duration = parseInt($('#du').value, 10), mark = Number($('#mk').value), neg = Number($('#ng').value);
    if (!title) return m.innerHTML = '<div class="msg err">Enter a title.</div>';
    if (isNaN(sa) || isNaN(ea) || ea <= sa) return m.innerHTML = '<div class="msg err">Closes must be after Opens.</div>';
    if (!(duration >= 5)) return m.innerHTML = '<div class="msg err">Time must be at least 5 minutes.</div>';
    if (!qs.length || errs.length) return m.innerHTML = '<div class="msg err">Fix the questions first (see the red box).</div>';
    if (x && Date.now() >= ms(x.startAt) && !confirm('This test has already started. Changing questions now can confuse students. Save anyway?')) return;
    const eid = x ? x.id : 'mock-' + sa.toISOString().slice(0, 10) + '-' + Math.random().toString(36).slice(2, 6);
    const secs = []; qs.forEach(q => { if (!secs.includes(q.sec)) secs.push(q.sec); });
    const paper = qs.map((q, i) => ({ id: 'q' + (i + 1), sec: q.sec, topic: q.topic, q: q.q, o: q.o }));
    const key = {}; qs.forEach((q, i) => key['q' + (i + 1)] = q.ans);
    $('#sv').disabled = true;
    try {
      const b = writeBatch(db);
      b.set(doc(db, 'exams', eid), { title, desc: $('#de').value.trim(), startAt: Timestamp.fromDate(sa), endAt: Timestamp.fromDate(ea),
        duration, mark, neg, count: qs.length, total: r2(qs.length * mark), sections: secs, published: $('#pb').checked,
        resultsOut: x ? !!x.resultsOut : false, updatedAt: serverTimestamp() });
      b.set(doc(db, 'exams', eid, 'paper', 'main'), { questions: paper });
      b.set(doc(db, 'keys', eid), { ans: key });
      await b.commit();
      m.innerHTML = '<div class="msg ok">Saved ✓</div>'; setTimeout(list, 700);
    } catch (e) { $('#sv').disabled = false; m.innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; }
  };
}

// ------------------------------------------------------------------ attempts
async function attempts(id) {
  const x = EXAMS.find(e => e.id === id);
  $('#app').innerHTML = '<div class="card muted">Loading attempts…</div>';
  let A = [];
  try { const s = await getDocs(collection(db, 'attempts', id, 'u')); A = s.docs.map(d => ({ uid: d.id, ...d.data() })); }
  catch (e) { $('#app').innerHTML = `<div class="card"><div class="msg err">${esc(errText(e))}</div></div>`; return; }
  A.sort((a, b) => ms(a.startedAt) - ms(b.startedAt));
  const sub = A.filter(a => a.submitted).length;
  $('#app').innerHTML = `<div class="card"><button class="btn ghost sm" id="bk" type="button">← Back</button>
    <h2 style="margin-top:12px">${esc(x.title)} – Attempts</h2>
    <p>Started: <b>${A.length}</b> · Submitted: <b>${sub}</b> · Writing / not submitted: <b>${A.length - sub}</b>
      <button class="btn ghost sm" id="rf" type="button">↻ Refresh</button></p>
    <p class="small muted">Reset deletes a student's attempt so they can start again (use only for genuine problems).</p>
    <div class="tbl"><table><thead><tr><th>#</th><th>Name</th><th>District</th><th>Started</th><th>Status</th><th class="n">Answered</th><th></th></tr></thead><tbody>
    ${A.map((a, i) => `<tr><td>${i + 1}</td><td><b>${esc(a.name)}</b></td><td>${esc(a.district)}</td><td>${esc(fmtDT(a.startedAt))}</td>
      <td>${a.submitted ? '<span class="chip c-ok">Submitted</span>' : '<span class="chip c-up">Not submitted</span>'}</td>
      <td class="n">${Object.keys(a.answers || {}).length}</td><td><button class="btn red sm" data-reset="${esc(a.uid)}" type="button">Reset</button></td></tr>`).join('') || '<tr><td colspan="7" class="muted">No attempts yet.</td></tr>'}
    </tbody></table></div></div>`;
  $('#bk').onclick = list; $('#rf').onclick = () => attempts(id);
  document.querySelectorAll('[data-reset]').forEach(b => b.onclick = async () => {
    const a = A.find(z => z.uid === b.dataset.reset);
    if (!confirm(`Reset the attempt of ${a.name}? Their answers will be deleted.`)) return;
    try { await deleteDoc(doc(db, 'attempts', id, 'u', a.uid)); attempts(id); } catch (e) { alert(errText(e)); }
  });
}

// ------------------------------------------------------------------ results
async function results(id) {
  const x = EXAMS.find(e => e.id === id);
  $('#app').innerHTML = '<div class="card muted">Loading…</div>';
  let R = null;   // admin copy with every student's row (adminresults is admin-only)
  try { const r = await getDoc(doc(db, 'adminresults', id)); R = r.exists() ? r.data() : null; } catch (e) {}
  const closed = Date.now() > ms(x.endAt);
  $('#app').innerHTML = `<div class="card"><button class="btn ghost sm" id="bk" type="button">← Back</button>
    <h2 style="margin-top:12px">${esc(x.title)} – Results</h2>
    ${closed ? '' : '<div class="msg info">This test is still open (closes ' + esc(fmtDT(x.endAt)) + '). You can calculate a preview, but publish only after it closes.</div>'}
    <div class="acts" style="margin-top:10px">
      <button class="btn gold" id="calc" type="button">🧮 Calculate results</button>
      ${R ? `<button class="btn ${x.resultsOut ? 'red' : ''}" id="pub" type="button">${x.resultsOut ? 'Hide results from students' : '📢 Publish results to students'}</button>
             <button class="btn ghost" id="csv" type="button">⬇ Download Excel (CSV)</button>` : ''}
    </div><div id="rm"></div>
    ${R ? `<p class="small muted" style="margin-top:12px">Calculated ${esc(fmtDT(R.calcAt))} · Participants ${R.n} · Highest ${R.high} · Average ${R.avg} · ${x.resultsOut ? '<b style="color:var(--ok)">Visible to students</b>' : '<b>Not visible to students yet</b>'}</p>
      <div class="tbl"><table><thead><tr><th>Rank</th><th>Name</th><th>District</th>${(R.sections || []).map(s => `<th class="n">${esc(s)}</th>`).join('')}<th class="n">Score</th><th class="n">Correct</th><th class="n">Wrong</th><th class="n">Time</th></tr></thead><tbody>
      ${(R.all || []).map(t => `<tr><td>${t.rank}</td><td><b>${esc(t.name)}</b>${t.submitted ? '' : ' <span class="chip c-up">auto</span>'}</td><td>${esc(t.district)}</td>
        ${(R.sections || []).map(s => `<td class="n">${t.secs && t.secs[s] ? t.secs[s].score : '–'}</td>`).join('')}
        <td class="n"><b>${t.score}</b></td><td class="n">${t.cor}</td><td class="n">${t.wrong}</td><td class="n">${t.mins} m</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Not calculated yet.</p>'}</div>`;
  $('#bk').onclick = list;
  $('#calc').onclick = () => calculate(x);
  if ($('#pub')) $('#pub').onclick = async () => {
    if (!x.resultsOut && !closed && !confirm('The test is still open. Publish results anyway?')) return;
    try { await updateDoc(doc(db, 'exams', id), { resultsOut: !x.resultsOut }); x.resultsOut = !x.resultsOut; results(id); } catch (e) { alert(errText(e)); }
  };
  if ($('#csv')) $('#csv').onclick = () => {
    const secs = R.sections || [];
    const lines = [['Rank', 'Name', 'District', 'Email', ...secs, 'Score', 'Correct', 'Wrong', 'Not answered', 'Minutes', 'Submitted']]
      .concat((R.all || []).map(t => [t.rank, t.name, t.district, t.email || '', ...secs.map(s => t.secs && t.secs[s] ? t.secs[s].score : ''), t.score, t.cor, t.wrong, t.skip, t.mins, t.submitted ? 'Yes' : 'Auto']));
    const csv = '﻿' + lines.map(r => r.map(v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = (x.title.replace(/[^\w]+/g, '_') || 'results') + '.csv'; a.click();
  };
}

async function calculate(x) {
  const m = $('#rm'); m.innerHTML = '<div class="msg info">Calculating… please wait.</div>'; $('#calc').disabled = true;
  try {
    const [ks, ps, as, us] = await Promise.all([getDoc(doc(db, 'keys', x.id)), getDoc(doc(db, 'exams', x.id, 'paper', 'main')),
      getDocs(collection(db, 'attempts', x.id, 'u')), getDocs(collection(db, 'users'))]);
    const key = ks.data().ans, qs = ps.data().questions, emails = {};
    us.docs.forEach(d => emails[d.id] = d.data().email || '');
    const secs = []; qs.forEach(q => { if (!secs.includes(q.sec)) secs.push(q.sec); });
    const rows = as.docs.map(d => {
      const a = d.data(), ans = a.answers || {}; let cor = 0, wrong = 0; const S = {};
      secs.forEach(s => S[s] = { c: 0, w: 0, n: 0, score: 0, total: 0 });
      qs.forEach(q => { const s = S[q.sec]; s.n++; const u = ans[q.id]; if (!u) return; if (u === key[q.id]) { cor++; s.c++; } else { wrong++; s.w++; } });
      secs.forEach(k => { const s = S[k]; s.score = r2(s.c * x.mark - s.w * x.neg); s.total = r2(s.n * x.mark); delete s.n; });
      const end = a.submittedAt ? ms(a.submittedAt) : Math.min(ms(a.savedAt), ms(a.startedAt) + x.duration * 60000);
      return { uid: d.id, name: a.name, district: a.district, email: emails[d.id] || '', submitted: !!a.submitted,
        cor, wrong, skip: qs.length - cor - wrong, score: r2(cor * x.mark - wrong * x.neg), secs: S, answers: ans,
        mins: Math.max(0, Math.round((end - ms(a.startedAt)) / 60000)), t: end - ms(a.startedAt) };
    }).sort((a, b) => b.score - a.score || a.t - b.t);
    rows.forEach((r, i) => r.rank = i > 0 && r.score === rows[i - 1].score && r.t === rows[i - 1].t ? rows[i - 1].rank : i + 1);
    const n = rows.length, high = n ? rows[0].score : 0, avg = n ? r2(rows.reduce((s, r) => s + r.score, 0) / n) : 0;
    // write each student's result (400 per batch)
    for (let i = 0; i < rows.length; i += 400) {
      const b = writeBatch(db);
      rows.slice(i, i + 400).forEach(r => b.set(doc(db, 'myresults', x.id, 'u', r.uid),
        { rank: r.rank, score: r.score, cor: r.cor, wrong: r.wrong, skip: r.skip, secs: r.secs, answers: r.answers }));
      await b.commit();
    }
    const strip = r => ({ rank: r.rank, name: r.name, district: r.district, score: r.score });
    // public summary for students (Top 10 + answer key) – no emails
    await setDoc(doc(db, 'results', x.id), {
      title: x.title, total: x.total, n, high, avg, sections: secs, key, calcAt: serverTimestamp(),
      top: rows.slice(0, 10).map(strip) });
    // full list for admin only
    await setDoc(doc(db, 'adminresults', x.id), {
      title: x.title, total: x.total, n, high, avg, sections: secs, calcAt: serverTimestamp(),
      all: rows.map(r => ({ rank: r.rank, name: r.name, district: r.district, email: r.email, score: r.score, cor: r.cor, wrong: r.wrong, skip: r.skip, mins: r.mins, submitted: r.submitted,
        secs: Object.fromEntries(secs.map(s => [s, { score: r.secs[s].score }])) }))
    });
    m.innerHTML = `<div class="msg ok">Done ✓ ${n} students. Now press "Publish results to students".</div>`;
    setTimeout(() => results(x.id), 900);
  } catch (e) { $('#calc').disabled = false; m.innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; }
}
</script>
</body>
</html>
