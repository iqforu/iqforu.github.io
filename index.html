<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IQ FOR U – Mocks for All Competitive Exams</title>
<meta name="description" content="IQ FOR U online mock tests for SSC, Railway, TET, Banking and State exams. Real CBT exam screen, negative marking, merit list, rank and response sheet.">
<meta property="og:title" content="IQ FOR U – Mocks for All Competitive Exams">
<meta property="og:description" content="Online mock tests with real CBT exam screen, merit list and response sheet.">
<meta property="og:image" content="logo.png">
<meta name="theme-color" content="#111318">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --y:#FFE51F; --y2:#FFF6B3; --ink:#111318; --ink2:#2A2E37; --mut:#6B7280; --line:#E7E8EC; --bg:#F6F6F2; --card:#fff;
  --ok:#16A34A; --ok2:#DCFCE7; --no:#DC2626; --no2:#FEE2E2; --mk:#7C3AED; --nv:#C9CDD4; --or:#FB923C; --or2:#FFF7ED;
  --sh:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
.hide{display:none!important}
.mut{color:var(--mut)} .small{font-size:13px} .tiny{font-size:12px} .center{text-align:center}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:up .3s ease both}

/* ---------- top bar */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff}
.top .in{max-width:560px;margin:auto;display:flex;align-items:center;gap:10px;padding:9px 14px}
.top img{width:36px;height:36px;border-radius:50%}
.top .t1{font-weight:900;font-size:16px;color:var(--y);letter-spacing:.3px;line-height:1.1}
.top .t2{font-size:11.5px;color:#BFC3CC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.top .sp{flex:1}
.top .back{background:none;border:0;color:#fff;font-size:20px;padding:2px 6px 2px 0}
.top .ttl{font-weight:800;font-size:16px;color:var(--y);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrapw{max-width:560px;margin:auto;padding:12px 14px 90px}
body.adm .top .in{max-width:1000px}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--ink);background:var(--y);color:var(--ink);font-weight:800;border-radius:12px;padding:11px 16px;font-size:15px;box-shadow:0 2px 0 var(--ink);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.dk{background:var(--ink);color:var(--y)}
.btn.gh{background:#fff;border-color:var(--line);box-shadow:none}
.btn.red{background:#fff;border-color:#FCA5A5;color:var(--no);box-shadow:none}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.link{background:none;border:0;padding:0;font-weight:700;text-decoration:underline}

/* ---------- cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sec{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;margin:18px 0 9px}
.sec a,.sec button{font-size:12.5px;color:var(--mut);font-weight:700;background:none;border:0;text-decoration:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:#EEF0F3;color:#555;white-space:nowrap}
.c-free{background:var(--ok2);color:#166534} .c-paid{background:var(--y2);color:#7A5B00;border:1px solid #E8C900}
.c-live{background:var(--no2);color:#B91C1C} .c-cat{background:#EEF2FF;color:#3730A3} .c-done{background:#E0F2FE;color:#075985}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pl 1.3s infinite}
@keyframes pl{50%{opacity:.3}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:13px;font-weight:700}
.chips button.on{background:var(--ink);color:var(--y);border-color:var(--ink)}
.msg{padding:10px 12px;border-radius:10px;margin-top:10px;font-size:14px}
.msg.err{background:var(--no2);color:#991B1B} .msg.ok{background:var(--ok2);color:#14532D} .msg.info{background:var(--y2);color:#5C4600}

/* ---------- home */
.livec{background:var(--y);border:1.5px solid var(--ink);border-radius:16px;padding:14px;box-shadow:3px 3px 0 var(--ink)}
.livec h3{margin:7px 0 2px;font-size:18px;font-weight:900}
.livec .m{font-size:13px}
.livec .r{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.newc{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px dashed var(--ink);border-radius:14px;padding:12px;margin-top:12px}
.newc .e{font-size:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}
.stats b{display:block;font-size:19px;font-weight:900} .stats small{font-size:11px;color:var(--mut);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tl{position:relative;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 3px 8px;text-align:center;font-size:11.5px;font-weight:700;line-height:1.2;text-decoration:none}
.tl span{display:block;font-size:23px;margin-bottom:4px}
.tl em{position:absolute;top:-6px;right:-3px;background:var(--ink);color:var(--y);font-size:8.5px;font-style:normal;padding:1px 5px;border-radius:6px;font-weight:800}
.banner{border-radius:13px;padding:11px 12px;font-size:13.5px;margin-bottom:12px;line-height:1.45}
.banner.v{background:var(--or2);border:1.5px solid var(--or)}
.banner.n{background:var(--ink);color:#fff} .banner.n b{color:var(--y)}
.banner.b{background:var(--no2);border:1.5px solid #FCA5A5;color:#991B1B}
.ulist .it{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:8px}
.ulist .it .e{font-size:22px}
.foot{margin-top:24px;text-align:center;font-size:12.5px;color:var(--mut)}
.foot a{margin:0 5px;color:var(--mut)}

/* ---------- test cards */
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:0;background:#E9EAEE;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700}
.tabs button.on{background:var(--ink);color:var(--y)}
.xc{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:11px}
.xc.lv{border:1.5px solid var(--ink)}
.xc h3{font-size:16.5px;margin:7px 0 4px;line-height:1.3}
.xc .ds{font-size:13px;color:var(--mut);margin:0 0 4px}
.meta{display:flex;flex-wrap:wrap;gap:4px 11px;font-size:12.5px;color:var(--mut)}
.cd{display:flex;gap:5px;align-items:center;margin:9px 0}
.cd div{background:var(--ink);color:var(--y);border-radius:8px;padding:4px 8px;text-align:center;font-weight:900;font-size:16px;min-width:42px;font-variant-numeric:tabular-nums}
.cd small{display:block;font-size:8.5px;color:#BFC3CC;font-weight:700;letter-spacing:.4px}
.cd span{font-size:12px;color:var(--mut);margin-left:3px}
.empty{text-align:center;padding:30px 14px;color:var(--mut)} .empty .ic{font-size:40px}

/* ---------- bottom nav */
.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bn .in{max-width:560px;margin:auto;display:flex}
.bn button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 8px;font-size:11px;color:var(--mut);font-weight:600}
.bn button span{font-size:19px;line-height:26px;padding:0 14px;border-radius:14px}
.bn button.on{color:var(--ink);font-weight:800}
.bn button.on span{background:var(--y)}
body.inexam .bn,body.inexam #top{display:none}

/* ---------- forms */
.auth{min-height:100vh;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;padding:24px 16px 30px}
.auth .lg{width:104px;height:104px;border-radius:50%}
.auth h1{color:var(--y);margin:10px 0 0;font-size:24px;font-weight:900}
.auth .tg{color:#BFC3CC;font-size:13.5px}
.auth .box{background:#fff;color:var(--ink);border-radius:18px;padding:18px;width:100%;max-width:420px;margin-top:18px}
.auth .box h2{margin:0 0 2px;font-size:19px}
.form{max-width:460px;margin:auto}
label.l{display:block;font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 5px}
.inp,input.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;font-size:15px;outline:0}
.inp:focus{border-color:var(--ink)}
.inp.good{border-color:var(--ok)} .inp.bad{border-color:var(--no)}
.mob{display:flex} .mob b{display:flex;align-items:center;border:1.5px solid var(--line);border-right:0;border-radius:11px 0 0 11px;padding:0 11px;background:#F3F4F6}
.mob input{border-radius:0 11px 11px 0}
.pw{position:relative} .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:12.5px;font-weight:700;color:var(--mut);padding:6px}
.pw input{padding-right:58px}
.hint{font-size:12px;margin-top:4px;color:var(--mut)} .hint.ok{color:var(--ok);font-weight:700} .hint.bad{color:var(--no);font-weight:700}
.or{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin:12px 0 10px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.gbtn b{color:#4285F4;font-size:17px;font-weight:900}
.note{background:var(--y2);border-radius:10px;padding:9px 11px;font-size:12.5px;margin-top:12px;line-height:1.45}

/* ---------- exam */
.xbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.xbar .in{display:flex;align-items:center;gap:8px;padding:8px 12px}
.xbar img{width:26px;height:26px;border-radius:50%}
.xbar .tt{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xbar .tt small{display:block;font-weight:500;font-size:11.5px;color:#BFC3CC}
.timer{background:var(--y);color:var(--ink);font-weight:900;border-radius:9px;padding:5px 10px;font-size:17px;font-variant-numeric:tabular-nums}
.timer.low{background:var(--no);color:#fff;animation:pl 1s infinite}
.xbar .sb{background:transparent;border:1.5px solid #555;color:#fff;border-radius:9px;padding:5px 10px;font-weight:700;font-size:13px}
.prog{height:3px;background:#2A2E37} .prog i{display:block;height:100%;background:var(--y);transition:width .3s}
.stabs{display:flex;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.stabs button{flex:none;border:0;background:#F1F2F4;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.stabs button.on{background:var(--ink);color:var(--y)}
.xmain{display:flex;max-width:1200px;margin:auto}
.xq{flex:1;min-width:0;padding:14px 14px 90px}
.qh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-bottom:9px;gap:8px}
.qh b{color:var(--ink);font-size:14px}
.rep{background:none;border:0;font-size:12.5px;color:var(--mut);font-weight:700}
.qt{font-size:17px;font-weight:600;line-height:1.55;margin:0 0 14px;white-space:pre-wrap}
.op{display:flex;gap:11px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:11px 12px;margin-bottom:9px;font-size:15.5px}
.op i{font-style:normal;flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--nv);display:grid;place-items:center;font-size:13px;font-weight:800}
.op.sel{border-color:var(--ink);background:var(--y2)}
.op.sel i{background:var(--ink);color:var(--y);border-color:var(--ink)}
.clr{background:none;border:0;color:var(--mut);font-size:13px;font-weight:700;text-decoration:underline;display:block;margin:4px auto 0}
.ab{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.ab .in{display:flex;gap:6px;max-width:1200px;margin:auto}
.ab button{flex:1;font-size:12.5px;font-weight:800;padding:10px 3px;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.ab .mkb{border-color:var(--mk);color:var(--mk)}
.ab .nx{background:var(--ink);color:var(--y);border-color:var(--ink)}
.side{display:none}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.pq{position:relative;height:36px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:800;border:0;background:#fff;box-shadow:inset 0 0 0 1.5px var(--nv);color:var(--ink2);font-style:normal}
.pq.a{background:var(--ok);color:#fff;box-shadow:none} .pq.n{background:var(--no);color:#fff;box-shadow:none}
.pq.m{background:var(--mk);color:#fff;border-radius:50%;box-shadow:none}
.pq.am{background:var(--mk);color:#fff;border-radius:50%;box-shadow:none}
.pq.am:after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;background:var(--ok);border-radius:50%;border:2px solid #fff}
.pq.cur{outline:3px solid var(--y);outline-offset:1px}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12.5px;margin-bottom:10px}
.leg span{display:flex;align-items:center;gap:7px}
.leg .pq{width:26px;height:26px;font-size:11px;flex:none}
@media(min-width:900px){
  .side{display:block;width:300px;flex:none;border-left:1px solid var(--line);background:#fff;padding:14px;position:sticky;top:96px;height:calc(100vh - 96px);overflow:auto}
  .ab .palb{display:none}
  .xq{padding:20px 28px 90px}
  .opts2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
}
/* sheet / modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(17,19,24,.55);display:flex;align-items:flex-end;justify-content:center;animation:up .2s}
.ov.c{align-items:center;padding:16px}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.ov.c .sheet{border-radius:18px;max-width:440px}
.grab{width:40px;height:4px;background:#D4D6DB;border-radius:4px;margin:0 auto 12px}
.sum{width:100%;border-collapse:collapse;font-size:13.5px}
.sum td,.sum th{padding:7px 5px;border-bottom:1px solid var(--line);text-align:center}
.sum td:first-child,.sum th:first-child{text-align:left}
.sum th{font-size:12px}
.stars{display:flex;justify-content:center;gap:6px}
.stars button{background:none;border:0;font-size:34px;color:#D4D6DB;padding:0}
.stars button.on{color:#F5B400}
.tagc{display:flex;flex-wrap:wrap;gap:6px}
.tagc button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 11px;font-size:12.5px;font-weight:700}
.tagc button.on{background:var(--y2);border-color:#E8C900}
.tagc.one button.on{background:var(--ink);color:var(--y);border-color:var(--ink)}

/* ---------- done + result */
.done{text-align:center;padding-top:10px}
.done .ck{width:76px;height:76px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:40px;font-weight:900;margin:10px auto}
.resc{background:var(--ink);color:#fff;border-radius:16px;padding:14px;margin-top:14px;text-align:center}
.resc .d{font-size:19px;font-weight:900;color:var(--y);margin:4px 0}
.resc .cd{justify-content:center}
.resc .cd div{background:#2A2E37}
.score{background:var(--ink);color:#fff;border-radius:16px;padding:16px;text-align:center}
.score .r3{display:flex;justify-content:space-around;margin-top:8px;font-size:12px;color:#BFC3CC}
.score .r3 b{display:block;font-size:19px;color:#fff}
.score .r3 b.y{color:var(--y)}
.sbar .t{display:flex;justify-content:space-between;font-size:13.5px;margin-top:9px}
.sbar .tr{height:8px;border-radius:6px;background:#EEF0F3;overflow:hidden;margin-top:4px}
.sbar .tr i{display:block;height:100%;background:var(--ink)}
.mine{display:flex;align-items:center;gap:12px;background:var(--y);border:1.5px solid var(--ink);border-radius:14px;padding:10px 13px;margin-bottom:12px}
.mine .rk{font-size:28px;font-weight:900}
table.mt{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.mt th{background:var(--ink);color:var(--y);text-align:left;padding:8px 7px;font-size:12px}
table.mt td{padding:8px 7px;border-bottom:1px solid var(--line)}
table.mt .n{text-align:right}
table.mt tr.me td{background:var(--y2);font-weight:800}
.rv{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}
.rv .q{font-weight:600;margin:6px 0 8px;white-space:pre-wrap}
.rv .o{border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:6px;font-size:14px}
.rv .o.c{border-color:var(--ok);background:#F0FDF4;font-weight:700}
.rv .o.w{border-color:var(--no);background:#FEF2F2}
.pf{background:var(--ink);color:#fff;text-align:center;padding:20px 14px 18px}
.pf .av{width:64px;height:64px;border-radius:50%;background:var(--y);color:var(--ink);border:2px solid #fff;display:grid;place-items:center;font-weight:900;font-size:26px;margin:0 auto}
.menu{background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:12px}
.menu button,.menu a{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 2px;font-size:14.5px;text-align:left;text-decoration:none}
.menu>:last-child{border-bottom:0}
.menu .ar{margin-left:auto;color:var(--mut)}
.doc h2{font-size:17px;margin:18px 0 6px} .doc p,.doc li{font-size:14.5px;line-height:1.6;color:var(--ink2)}

/* ---------- print (response sheet) */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body.printing>*:not(#print){display:none!important}
  body.printing #print{display:block}
  body.printing{background:#fff}
}
#print{font-size:11px;color:#111}
#print .ph{display:flex;align-items:center;gap:10px;border-bottom:3px solid #111;padding-bottom:8px}
#print .ph img{width:52px;height:52px}
#print .ph .tag{margin-left:auto;background:#FFE51F;border:1.5px solid #111;font-weight:900;padding:4px 9px;border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#print table{width:100%;border-collapse:collapse}
#print .det td{padding:3px 4px}
#print .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
#print .cards div{border:1px solid #ccc;border-radius:6px;padding:6px;text-align:center}
#print .cards div b{display:block;font-size:16px}
#print .cards .k{background:#111;color:#FFE51F;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#print .qt2 th{background:#111;color:#fff;padding:5px;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#print .qt2 td{padding:5px;border-bottom:1px solid #ddd;vertical-align:top}
#print .qt2 tr{page-break-inside:avoid}
#print .g{color:#16A34A;font-weight:900} #print .r{color:#DC2626;font-weight:900}

<body>
<header class="top" id="top"><div class="in" id="topin"></div></header>
<main id="app"><div class="wrapw"><div class="card center mut">Loading…</div></div></main>
<nav class="bn" id="bn"><div class="in">
  <button type="button" data-nav="home"><span>🏠</span>Home</button>
  <button type="button" data-nav="tests"><span>📝</span>Tests</button>
  <button type="button" data-nav="results"><span>📊</span>Results</button>
  <button type="button" data-nav="profile" id="bnp"><span>👤</span>Login</button>
</div></nav>
<div id="print"></div>

<script type="module">
import { firebaseConfig, SITE } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut,
         createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail,
         sendEmailVerification, updatePassword, EmailAuthProvider, reauthenticateWithCredential }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ================================================================ helpers
const NAME = (SITE && SITE.name) || 'IQ FOR U';
const TAG = 'Mocks for All Competitive Exams';
const IG = (SITE && SITE.instagram) || '';
const IG_HANDLE = (IG.match(/instagram\.com\/([^/?#]+)/) || [])[1] || '';
const ALLX = 'All Competitive Exams';
const CATS = [ALLX, 'SSC', 'Railway', 'TET', 'Banking', 'State Exams', 'Other'];
const STATES = ['Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Goa','Gujarat','Haryana','Himachal Pradesh','Jharkhand','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal','Andaman and Nicobar Islands','Chandigarh','Dadra and Nagar Haveli and Daman and Diu','Delhi','Jammu and Kashmir','Ladakh','Lakshadweep','Puducherry'];
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms = t => t && typeof t.toMillis === 'function' ? t.toMillis() : (t instanceof Date ? t.getTime() : Number(t) || 0);
const fmtDT = t => new Date(ms(t)).toLocaleString('en-IN', { weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit', hour12:true });
const fmtD = t => new Date(ms(t)).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
const r2 = v => Math.round(v * 100) / 100;
const pad = n => String(n).padStart(2, '0');
const first = s => String(s || '').trim().split(/\s+/)[0];
let SKEW = 0; const now = () => Date.now() + SKEW;
const isPwdUser = u => !!(u && (u.providerData || []).some(p => p.providerId === 'password'));
function errText(e) {
  const c = (e && e.code) || '';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-login')) return 'Wrong Gmail or password. Please check and try again.';
  if (c.includes('email-already-in-use')) return 'This Gmail is already registered. Please Login (or use Forgot password).';
  if (c.includes('weak-password')) return 'Password is too weak. Use at least 6 characters.';
  if (c.includes('invalid-email')) return 'Enter a valid Gmail address.';
  if (c.includes('too-many-requests')) return 'Too many tries. Please wait a few minutes and try again.';
  if (c.includes('requires-recent-login')) return 'For safety, please logout and login again, then try.';
  if (c.includes('permission-denied')) return 'Not allowed now (time over, test not open, or account blocked).';
  if (c.includes('unavailable') || c.includes('network')) return 'No internet. Please check your connection and try again.';
  if (c.includes('popup-closed') || c.includes('cancelled-popup')) return 'Login window was closed. Please try again.';
  if (c.includes('popup-blocked')) return 'Popup was blocked. Allow popups, or use Gmail + Password login.';
  if (c.includes('unauthorized-domain')) return 'This website is not added in Firebase → Authentication → Authorized domains.';
  if (c.includes('operation-not-allowed')) return 'Gmail + Password login is not switched ON in Firebase (Authentication → Sign-in method).';
  return (e && e.message) || String(e);
}
function toast(t, kind) {
  const d = document.createElement('div'); d.className = 'msg toast ' + (kind || 'info'); d.textContent = t;
  document.body.appendChild(d); setTimeout(() => d.remove(), 4200);
}
function sheet(html, center) {
  const o = document.createElement('div'); o.className = 'ov' + (center ? ' c' : '');
  o.innerHTML = `<div class="sheet">${center ? '' : '<div class="grab"></div>'}${html}</div>`;
  o.addEventListener('click', e => { if (e.target === o) o.remove(); });
  document.body.appendChild(o); return o;
}
function confirmBox(html, yes, no) {
  return new Promise(res => {
    const o = sheet(`${html}<div style="display:flex;gap:8px;margin-top:14px"><button class="btn gh" style="flex:1" data-v="0" type="button">${esc(no || 'Cancel')}</button><button class="btn dk" style="flex:1" data-v="1" type="button">${esc(yes)}</button></div>`, true);
    o.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) { o.remove(); res(b.dataset.v === '1'); } else if (e.target === o) res(false); });
  });
}
function cdHtml(left, short) {
  left = Math.max(0, left);
  const s = Math.floor(left / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  const box = (v, l) => `<div>${pad(v)}<small>${l}</small></div>`;
  return d ? box(d, 'DAYS') + box(h, 'HRS') + box(m, 'MIN') : box(h, 'HRS') + box(m, 'MIN') + box(sec, 'SEC');
}
function leftTxt(t) { const m = Math.max(0, Math.round(t / 60000)), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60; return d ? `${d}d ${h}h` : h ? `${h}h ${mm}m` : `${mm}m`; }

// ================================================================ state
let USER = null, PROFILE = null, BLOCKED = false, EXAMS = [], ATT = {}, UNL = {}, PUB = {}, MYR = {}, PASS = null;
let OLDP = {}, CAT = 'All', TTAB = null, NEXT = null, REGISTERING = false, AUTH_READY = false, X = null;
const PAPER = {};
try { CAT = localStorage.getItem('iq_cat') || 'All'; } catch (e) {}

if (/Instagram|FBAN|FBAV|FB_IAB/i.test(navigator.userAgent)) window.__inApp = true;

// ================================================================ router
const go = h => { if (location.hash === '#/' + h) route(); else location.hash = '#/' + h; };
function needLogin(next) { NEXT = next || location.hash; go('login'); }
window.addEventListener('hashchange', () => {
  if (X && !X.done && !X.preview) { if (location.hash !== '#/exam') { history.pushState(null, '', '#/exam'); toast('Test is running. Use Submit to finish.', 'info'); } return; }
  route();
});
$$('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));

function setNav(k) {
  $$('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === k));
  $('#bnp').innerHTML = `<span>👤</span>${USER ? 'Profile' : 'Login'}`;
}
function topMain() {
  $('#topin').innerHTML = `<img src="logo.png" alt=""><div style="min-width:0"><div class="t1">${esc(NAME)}</div><div class="t2">${USER && PROFILE ? 'Hi, ' + esc(first(PROFILE.name)) + ' 👋' : esc(TAG)}</div></div><div class="sp"></div>
    ${USER ? '' : '<button class="btn sm" id="tl" type="button" style="box-shadow:none">Login</button>'}`;
  if ($('#tl')) $('#tl').onclick = () => go('login');
}
function topBack(title, back) {
  $('#topin').innerHTML = `<button class="back" id="tb" type="button" aria-label="Back">←</button><div class="ttl">${esc(title)}</div>`;
  $('#tb').onclick = () => back ? go(back) : (history.length > 1 ? history.back() : go('home'));
}
function shell(html, nav) {
  document.body.classList.remove('inexam', 'adm');
  $('#top').classList.remove('hide'); $('#bn').classList.toggle('hide', !nav);
  if (nav) setNav(nav);
  $('#app').innerHTML = html; window.scrollTo(0, 0);
}

async function route() {
  if (!AUTH_READY) return;
  if (X && X.preview) stopExam();
  const h = (location.hash || '#/home').replace(/^#\/?/, ''), [v, a] = h.split('/');
  if (USER && !PROFILE && !['complete', 'page', 'admin'].includes(v)) return go('complete');
  switch (v) {
    case '': case 'home': return home();
    case 'tests': return tests();
    case 'results': return USER ? results(a) : needLogin('#/results');
    case 'profile': return USER ? profile() : go('login');
    case 'edit': return USER ? editProfile() : go('login');
    case 'password': return USER ? changePw() : go('login');
    case 'login': return USER ? go('home') : loginView();
    case 'register': return USER ? go('home') : registerView();
    case 'forgot': return forgotView();
    case 'complete': return USER ? completeView() : go('login');
    case 'page': return pageView(a);
    case 'start': return USER ? instructions(a) : needLogin('#/start/' + a);
    case 'admin': return openAdmin();
    case 'exam': { let r = null; try { r = sessionStorage.getItem('iq_run'); } catch (e) {} return USER && r ? go('start/' + r) : go('home'); }
    default: return home();
  }
}

// ================================================================ auth state
onAuthStateChanged(auth, async u => {
  if (REGISTERING) { USER = u; return; }
  USER = u; PROFILE = null; BLOCKED = false; ATT = {}; UNL = {}; MYR = {}; PASS = null;
  if (u) {
    try { const s = await getDoc(doc(db, 'users', u.uid)); const d = s.exists() ? s.data() : null; OLDP = d || {}; PROFILE = d && d.name && d.mobile && d.state ? d : null; } catch (e) { PROFILE = null; }
    try { const b = await getDoc(doc(db, 'blocked', u.uid)); BLOCKED = b.exists(); } catch (e) {}
    await loadPass();
  }
  AUTH_READY = true;
  if (u && PROFILE && NEXT) { const n = NEXT; NEXT = null; if (location.hash === n) route(); else location.hash = n; return; }
  route();
});
async function loadPass() { PASS = null; if (!USER) return; try { const s = await getDoc(doc(db, 'passes', USER.uid)); PASS = s.exists() ? s.data() : null; } catch (e) { PASS = null; } }
// 🎟 Monthly Pass: active when it exists and (no expiry or not yet expired)
const passActive = () => !!(PASS && (PASS.until == null || now() < ms(PASS.until)));
async function loadPub() { try { const s = await getDoc(doc(db, 'settings', 'public')); PUB = s.exists() ? s.data() : {}; } catch (e) { PUB = {}; } }
const pubReady = loadPub();

// ================================================================ data
async function loadExams() {
  const qs = await getDocs(query(collection(db, 'exams'), where('published', '==', true)));
  EXAMS = qs.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => ms(a.startAt) - ms(b.startAt));
  if (USER) {
    await Promise.all(EXAMS.map(async x => {
      if (!(x.id in ATT) && now() >= ms(x.startAt)) {
        try { const s = await getDoc(doc(db, 'attempts', x.id, 'u', USER.uid)); ATT[x.id] = s.exists() ? s.data() : null; } catch (e) { ATT[x.id] = null; }
      }
      if (needsPass(x) && !passActive() && !(x.id in UNL)) {
        try { const s = await getDoc(doc(db, 'unlocks', x.id, 'u', USER.uid)); UNL[x.id] = s.exists(); } catch (e) { UNL[x.id] = false; }
      }
    }));
  }
}
const resOpen = x => !x.resultsHold && (x.resultsOut || (x.resultAt && now() >= ms(x.resultAt)));
const resWhen = x => x.resultAt ? fmtDT(x.resultAt) : 'soon';
function st(x) {
  const t = now(), a = ATT[x.id];
  if (t < ms(x.startAt)) return 'up';
  if (t <= ms(x.endAt)) {
    if (a && a.submitted) return 'subm';
    if (a) return t < Math.min(ms(a.startedAt) + x.duration * 60000, ms(x.endAt)) ? 'resume' : 'subm';
    return 'live';
  }
  return resOpen(x) ? 'res' : 'closed';
}
const catOk = x => CAT === 'All' || (x.category || 'Other') === CAT || x.category === ALLX;
// access: 'free' = Free for all · 'pass' = Monthly Pass required (old mocks with a price also need the pass)
function needsPass(x) { return x.access === 'pass' || (x.access !== 'free' && (x.price || 0) > 0); }
const locked = x => needsPass(x) && !passActive() && !UNL[x.id];
const priceChip = x => needsPass(x) ? '<span class="chip c-pass">🎟 PASS</span>' : '<span class="chip c-free">FREE</span>';
// Rank display: 1–100 → "#56", above 100 → "100+". Total only when admin switches ON "Show total participants".
const showN = R => !!(PUB.showTotal && R && R.n != null);
const rankTxt = (r, R) => r == null ? '–' : (showN(R) || r <= 100) ? '#' + r : '100+';
function regLabel(n) { n = Math.floor(n || 0); if (n >= 1000) { const k = Math.floor(n / 100) / 10; return (k % 1 ? k.toFixed(1) : String(k)) + 'K+'; } return (n >= 20 ? Math.floor(n / 10) * 10 : n) + '+'; }
const catChip = x => `<span class="chip c-cat">${esc(x.category === ALLX ? 'All Exams' : (x.category || 'Other'))}</span>`;

function examCard(x, big) {
  const s = st(x), t = now(), paid = locked(x);
  const lab = { up: '<span class="chip">UPCOMING</span>', live: '<span class="chip c-live"><span class="dot"></span>LIVE</span>', resume: '<span class="chip c-live"><span class="dot"></span>IN PROGRESS</span>',
    subm: '<span class="chip c-done">SUBMITTED</span>', res: '<span class="chip c-done">RESULT OUT</span>', closed: '<span class="chip">CLOSED</span>' }[s];
  let cd = '', act = '';
  if (s === 'up') cd = `<div class="cd" data-to="${ms(x.startAt)}">${cdHtml(ms(x.startAt) - t)}</div><div class="cd-l tiny mut" style="margin-top:-4px">to start · opens ${esc(fmtDT(x.startAt))}</div>`;
  if (s === 'live') cd = `<div class="cd" data-to="${ms(x.endAt)}">${cdHtml(ms(x.endAt) - t)}</div><div class="tiny mut" style="margin-top:-4px">left to start · closes ${esc(fmtDT(x.endAt))}</div>`;
  if (!USER) {
    act = s === 'up' ? `<button class="btn gh block" type="button" disabled>🔔 Opens ${esc(fmtDT(x.startAt))}</button>`
      : s === 'live' ? `<button class="btn block" data-start="${esc(x.id)}" type="button">Login to Start →</button>`
      : `<button class="btn gh block" data-login="1" type="button">Login to see result</button>`;
  } else if (BLOCKED && (s === 'live' || s === 'resume')) act = '<div class="msg err" style="margin:0">Your account is blocked. Contact IQ FOR U.</div>';
  else if (s === 'up') act = paid ? `<button class="btn dk block" type="button" data-pay="${esc(x.id)}">🎟 Monthly Pass required</button>` : `<button class="btn gh block" type="button" disabled>🔔 Opens ${esc(fmtDT(x.startAt))}</button>`;
  else if (s === 'live') act = paid ? `<button class="btn dk block" type="button" data-pay="${esc(x.id)}">🎟 Monthly Pass required</button>` : `<button class="btn block" data-start="${esc(x.id)}" type="button">Start Test →</button>`;
  else if (s === 'resume') act = `<button class="btn block" data-start="${esc(x.id)}" type="button">↩ Resume Test</button>`;
  else if (s === 'subm') act = `<div class="msg info" style="margin:0">✅ Submitted · Result: <b>${esc(resWhen(x))}</b></div>`;
  else if (s === 'res') act = `<button class="btn dk block" data-res="${esc(x.id)}" type="button">📊 ${ATT[x.id] ? 'View my result' : 'Merit list & answer key'}</button>`;
  else act = `<div class="msg info" style="margin:0">Result on <b>${esc(resWhen(x))}</b></div>`;
  return `<article class="xc ${s === 'live' || s === 'resume' ? 'lv' : ''} fade">
    <div style="display:flex;gap:5px;flex-wrap:wrap">${lab}${catChip(x)}${priceChip(x)}</div>
    <h3>${esc(x.title)}</h3>${x.desc ? `<p class="ds">${esc(x.desc)}</p>` : ''}
    <div class="meta"><span>📝 ${x.count} Q</span><span>⏱ ${x.duration} min</span><span>✅ +${x.mark}</span><span>❌ −${x.neg}</span>${s === 'subm' || s === 'closed' || s === 'res' ? `<span>🗓 ${esc(fmtD(x.startAt))}</span>` : ''}</div>
    ${cd}<div style="margin-top:9px">${act}</div></article>`;
}
function bindCards(root) {
  (root || document).querySelectorAll('[data-start]').forEach(b => b.onclick = () => go('start/' + b.dataset.start));
  (root || document).querySelectorAll('[data-res]').forEach(b => b.onclick = () => go('results/' + b.dataset.res));
  (root || document).querySelectorAll('[data-login]').forEach(b => b.onclick = () => needLogin('#/results'));
  (root || document).querySelectorAll('[data-pay]').forEach(b => b.onclick = () => payInfo(b.dataset.pay));
}
function payInfo(id) {
  const x = EXAMS.find(e => e.id === id);
  sheet(`<h3 style="margin:0 0 6px">🎟 ${esc(x ? x.title : 'Monthly Pass')}</h3><p>This mock is for <b>Monthly Pass</b> students.${PASS && !passActive() ? ' Your pass expired on <b>' + esc(fmtD(PASS.until)) + '</b>.' : ''}</p>
    <div class="note">💳 Online Monthly Pass is <b>coming soon</b>. Meanwhile write our <b>FREE mocks</b> and follow ${IG_HANDLE ? '@' + esc(IG_HANDLE) : 'us'} on Instagram for updates.</div>
    <button class="btn block" style="margin-top:12px" type="button" onclick="this.closest('.ov').remove();window.__freeTab&&window.__freeTab()">🆓 See Free Mocks</button>
    <button class="btn gh block" style="margin-top:8px" type="button" onclick="this.closest('.ov').remove()">OK</button>`);
}
function chipsHtml() {
  return `<div class="chips" id="cats">${['All', ...CATS.filter(c => c !== ALLX)].map(c => `<button type="button" class="${c === CAT ? 'on' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
}
function bindChips(cb) { $$('[data-cat]').forEach(b => b.onclick = () => { CAT = b.dataset.cat; try { localStorage.setItem('iq_cat', CAT); } catch (e) {} cb(); }); }
const footHtml = () => `<div class="foot"><a href="#/page/contact">Contact</a>·<a href="#/page/terms">Terms</a>·<a href="#/page/refund">Refund</a>·<a href="#/page/privacy">Privacy</a><br>© ${new Date().getFullYear()} ${esc(NAME)} · ${esc(TAG)}</div>`;

// ================================================================ HOME
async function home() {
  topMain();
  shell(`<div class="wrapw fade" id="hm"><div class="card center mut">Loading tests…</div></div>`, 'home');
  try { await Promise.all([loadExams(), pubReady]); }
  catch (e) { $('#hm').innerHTML = `<div class="msg err">${esc(errText(e))}</div><button class="btn gh" style="margin-top:10px" type="button" onclick="location.reload()">↻ Retry</button>`; return; }
  renderHome();
  if (USER) homeStats();
}
function renderHome() {
  if (!$('#hm')) return;
  const L = EXAMS.filter(catOk), live = L.filter(x => ['live', 'resume'].includes(st(x))), up = L.filter(x => st(x) === 'up');
  const hero = live[0] || up[0];
  $('#hm').innerHTML = `
    ${BLOCKED ? '<div class="banner b">⛔ Your account is blocked. Please contact IQ FOR U.</div>' : ''}
    ${PUB.noticeOn && PUB.notice ? `<div class="banner n">📢 <b>Notice:</b> ${esc(PUB.notice)}</div>` : ''}
    ${hero ? `<div class="livec">${live[0] ? '<span class="chip c-live"><span class="dot"></span>LIVE NOW</span>' : '<span class="chip" style="background:#fff">NEXT TEST</span>'} ${catChip(hero)} ${priceChip(hero)}
        <h3>${esc(hero.title)}</h3><div class="m">${(hero.sections || []).map(esc).join(' · ') || ''}${(hero.sections || []).length ? ' · ' : ''}${hero.count} Q · ${hero.duration} min</div>
        <div class="r"><b style="font-size:13px">${live[0] ? 'Closes in ' + leftTxt(ms(hero.endAt) - now()) : 'Opens ' + esc(fmtDT(hero.startAt))}</b>
        ${live[0] ? `<button class="btn dk sm" type="button" id="hs">${st(hero) === 'resume' ? '↩ Resume' : 'Start Test →'}</button>` : `<button class="btn dk sm" type="button" id="hs">View →</button>`}</div></div>`
      : `<div class="livec"><h3 style="margin-top:0">No live test right now</h3><div class="m">Next mock will be announced on Instagram${IG_HANDLE ? ' @' + esc(IG_HANDLE) : ''}.</div></div>`}
    ${PUB.showRegCount && (PUB.regCount || 0) >= (PUB.regMin ?? 100) ? `<div class="regb">👥 <b>${regLabel(PUB.regCount)}</b> students registered</div>` : ''}
    ${USER ? '<div class="stats" id="st"><div><b>–</b><small>Tests taken</small></div><div><b>–</b><small>Best score</small></div><div><b>–</b><small>Best rank</small></div></div>'
      : `<div class="newc"><div class="e">🎓</div><div style="flex:1"><b>New here?</b><div class="small mut">Register free to write tests &amp; get your rank</div></div><button class="btn dk sm" id="hr" type="button">Register</button></div>`}
    <div class="sec">Choose exam</div>${chipsHtml()}
    <div class="sec">Explore</div>
    <div class="tiles">
      <button class="tl" type="button" data-go="tests"><span>📝</span>Mock Tests</button>
      <button class="tl" type="button" data-go="results"><span>📊</span>My Results</button>

  try { if (localStorage.getItem('iq_fb_' + x.id + '_' + USER.uid)) return; } catch (e) {}
  const F = { stars: 0, diff: '', tags: [] };
  const o = sheet(`<div style="font-weight:900;font-size:18px;text-align:center">How was this mock? 💬</div><div class="small mut center" style="margin-bottom:10px">Your feedback helps us make better tests</div>
    <div class="stars" id="fs">${[1, 2, 3, 4, 5].map(i => `<button type="button" data-s="${i}" aria-label="${i} star">★</button>`).join('')}</div>
    <label class="l">Difficulty level</label><div class="tagc one" id="fd">${['😊 Easy', '👍 Moderate', '😓 Hard'].map(d => `<button type="button" data-d="${d.split(' ')[1]}">${d}</button>`).join('')}</div>
    <label class="l">What did you like / face?</label><div class="tagc" id="ft">${['Good questions', 'Exam-level', 'Good explanation', 'Time not enough', 'App problem', 'Wrong question'].map(t => `<button type="button" data-t="${t}">${t}</button>`).join('')}</div>
    <label class="l" for="fc">Comment (optional)</label><textarea class="inp" id="fc" rows="2" maxlength="500" placeholder="Tell us anything…"></textarea>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn gh" style="flex:1" id="fk" type="button">Skip</button><button class="btn dk" style="flex:2" id="fy" type="button">Send Feedback</button></div><div id="fmm"></div>`);
  const q = s => o.querySelector(s);
  o.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { F.stars = +b.dataset.s; o.querySelectorAll('[data-s]').forEach(z => z.classList.toggle('on', +z.dataset.s <= F.stars)); });
  o.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { F.diff = b.dataset.d; o.querySelectorAll('[data-d]').forEach(z => z.classList.toggle('on', z === b)); });
  o.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const t = b.dataset.t, i = F.tags.indexOf(t); if (i < 0) F.tags.push(t); else F.tags.splice(i, 1); b.classList.toggle('on', i < 0); });
  const mark = () => { try { localStorage.setItem('iq_fb_' + x.id + '_' + USER.uid, '1'); } catch (e) {} };
  q('#fk').onclick = () => { mark(); o.remove(); };
  q('#fy').onclick = async () => {
    if (!F.stars) return q('#fmm').innerHTML = '<div class="msg err">Tap the stars to rate (1–5).</div>';
    q('#fy').disabled = true;
    try { await setDoc(doc(db, 'feedback', x.id, 'u', USER.uid), { stars: F.stars, diff: F.diff || '', tags: F.tags.slice(0, 8), comment: q('#fc').value.trim().slice(0, 500), name: PROFILE.name.slice(0, 60), state: PROFILE.state.slice(0, 60), at: serverTimestamp() });
      mark(); o.remove(); toast('Thank you for your feedback! 🙏', 'ok'); }
    catch (e) { mark(); o.remove(); toast((e.code || '').includes('permission') ? 'Feedback already sent ✓' : errText(e), 'info'); }
  };
}

// ================================================================ RESULTS
let RS = { id: null, tab: 'score', R: null, M: null, filt: 'all' };
async function results(id) {

      if (RS.R) { const m = await getDoc(doc(db, 'myresults', id, 'u', USER.uid)); RS.M = m.exists() ? m.data() : null; MYR[id] = RS.M; }
    } catch (e) { $('#rs').innerHTML = sel + `<div class="msg err">${esc(errText(e))}</div>`; return bind(); }
  }
  if (!RS.R) { $('#rs').innerHTML = sel + `<div class="card center" style="margin-top:12px">⏳ <b>Result is being prepared.</b><br><span class="small mut">Please check again a little later.</span></div>`; return bind(); }
  $('#rs').innerHTML = sel + `<div class="tabs" style="margin-top:10px">${[['score', 'Score'], ['merit', '🏆 Merit list'], ['review', 'Answer review']].map(([k, l]) => `<button type="button" data-rt="${k}" class="${RS.tab === k ? 'on' : ''}">${l}</button>`).join('')}</div><div id="rb"></div>`;
  bind(); $$('[data-rt]').forEach(b => b.onclick = () => { RS.tab = b.dataset.rt; $$('[data-rt]').forEach(z => z.classList.toggle('on', z === b)); rTab(x); });
  rTab(x);

async function getPaper(id) { if (!PAPER[id]) { const p = await getDoc(doc(db, 'exams', id, 'paper', 'main')); PAPER[id] = p.exists() ? p.data().questions : []; } return PAPER[id]; }
function rTab(x) {
  const R = RS.R, M = RS.M, el = $('#rb');
  if (M && M.acc == null) M.acc = M.cor + M.wrong ? Math.round(M.cor / (M.cor + M.wrong) * 1000) / 10 : 0;
  if (!R.merit) R.merit = (R.top || []).map(t => ({ r: t.rank, n: t.name, st: t.state || t.district || '', s: t.score, a: '–' }));
  if (RS.tab === 'score') {

    el.innerHTML = `<div class="score"><svg width="128" height="128" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" stroke="#2A2E37" stroke-width="10" fill="none"/><circle cx="50" cy="50" r="42" stroke="#FFE51F" stroke-width="10" fill="none" stroke-dasharray="${r2(C * pct)} ${r2(C)}" stroke-linecap="round" transform="rotate(-90 50 50)"/><text x="50" y="50" text-anchor="middle" fill="#fff" font-size="18" font-weight="900" font-family="Inter,sans-serif">${M.score}</text><text x="50" y="64" text-anchor="middle" fill="#BFC3CC" font-size="8" font-family="Inter,sans-serif">out of ${R.total}</text></svg>
        <div class="r3"><div><b class="y">${rankTxt(M.rank, R)}</b>Rank${showN(R) ? ' / ' + R.n : ''}</div><div><b>${M.acc}%</b>Accuracy</div><div><b>${M.mins != null ? M.mins + 'm' : '–'}</b>Time taken</div></div></div>
      <div class="stats"><div><b style="color:var(--ok)">${M.cor}</b><small>Correct</small></div><div><b style="color:var(--no)">${M.wrong}</b><small>Wrong</small></div><div><b>${M.skip}</b><small>Skipped</small></div></div>
      ${M.bonus ? `<div class="msg ok">🎁 Bonus +${M.bonus} for cancelled question(s) included.</div>` : ''}
      ${M.secs && Object.keys(M.secs).length > 1 ? `<div class="sec">Section-wise</div><div class="card">${(R.sections || Object.keys(M.secs)).filter(k => M.secs[k]).map(k => { const o = M.secs[k], w = o.total ? Math.max(0, Math.min(100, o.score / o.total * 100)) : 0; return `<div class="sbar"><div class="t"><b>${esc(k)}</b><span>${o.score} / ${o.total} <span class="mut">· ✓${o.c} ✗${o.w}</span></span></div><div class="tr"><i style="width:${w}%"></i></div></div>`; }).join('')}</div>` : ''}
      ${info}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn dk" id="dl" type="button">📄 Response Sheet</button><button class="btn" id="sh" type="button">📸 Share score</button></div>
      <div class="tiny mut center" style="margin-top:6px">Response sheet opens the print window — choose <b>Save as PDF</b>.</div>`;

    el.innerHTML = `${M ? `<div class="mine"><div class="rk">${rankTxt(M.rank, R)}</div><div class="small"><b>Your rank</b>${showN(R) ? ' out of ' + R.n : ''}${meIdx < 0 ? ' · not in Top ' + TOP + ' yet – keep practising! 💪' : ' · you are in the Top ' + TOP + ' 🎉'}<br>Score ${M.score} · Accuracy ${M.acc}%</div></div>` : ''}
      <div class="sec" style="margin-top:4px">🏆 Top ${TOP} merit list${showN(R) ? ` <span class="tiny mut">${R.n} students</span>` : ''}</div>
      <table class="mt"><tr><th>Rank</th><th>Name</th><th>State</th><th class="n">Score</th><th class="n">Acc.</th></tr>
      ${L.map((e, i) => `<tr class="${i === meIdx ? 'me' : ''}"><td>${e.r <= 3 ? ['🥇', '🥈', '🥉'][e.r - 1] + ' ' : ''}${e.r}</td><td>${esc(e.n)}${i === meIdx ? ' (You)' : ''}</td><td>${esc(e.st || '')}</td><td class="n">${e.s}</td><td class="n">${e.a === '–' ? '–' : e.a + '%'}</td></tr>`).join('')}
      ${M && meIdx < 0 ? `<tr><td colspan="5" class="center mut">• • •</td></tr><tr class="me"><td>${rankTxt(M.rank, R)}</td><td>${esc(PROFILE.name)} (You)</td><td>${esc(PROFILE.state || '')}</td><td class="n">${M.score}</td><td class="n">${M.acc}%</td></tr>` : ''}</table>
      <div class="tiny mut" style="margin-top:8px">Ranking: higher <b>score</b> first. Same score → higher <b>accuracy</b> first.</div>`;

      const key = R.key || {}, my = (M && M.answers) || {}, can = R.cancelled || [];
      const status = q => can.includes(q.id) ? 'x' : !my[q.id] ? 's' : my[q.id] === key[q.id] ? 'c' : 'w';
      const cnt = { all: P.length, c: 0, w: 0, s: 0, x: 0 }; P.forEach(q => cnt[status(q)]++);
      const F = RS.filt;
      el.innerHTML = `<div class="chips" style="margin-bottom:10px">${[['all', 'All ' + cnt.all], ['c', '✓ ' + cnt.c], ['w', '✗ ' + cnt.w], ['s', '– ' + cnt.s]].concat(cnt.x ? [['x', 'Cancelled ' + cnt.x]] : []).map(([k, l]) => `<button type="button" data-f="${k}" class="${F === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        ${P.map((q, i) => { const s = status(q); if (F !== 'all' && F !== s) return ''; const k = key[q.id], u = my[q.id];
          const badge = s === 'x' ? '<span class="chip c-cat">Cancelled · bonus</span>' : s === 'c' ? `<span class="chip c-free">Correct +${x.mark}</span>` : s === 'w' ? `<span class="chip c-live">Wrong −${x.neg}</span>` : '<span class="chip">Not answered</span>';
          return `<div class="rv"><div class="qh" style="margin:0"><b>Q${i + 1} · ${esc(q.sec)}</b>${badge}</div><div class="q">${esc(q.q)}</div>
            ${q.o.map((o, j) => { const L = 'ABCD'[j]; return `<div class="o ${L === k ? 'c' : (L === u ? 'w' : '')}"><b>${L}.</b> ${esc(o)}${L === k ? ' ✓' : ''}${L === u ? ' · your answer' : ''}</div>`; }).join('')}</div>`; }).join('') || '<div class="mut center">Nothing here.</div>'}`;
      $$('[data-f]').forEach(b => b.onclick = () => { RS.filt = b.dataset.f; rTab(x); });
    }).catch(e => { el.innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; });
  }
}
async function responseSheet(x) {
  let P; try { P = await getPaper(x.id); } catch (e) { return toast(errText(e), 'err'); }
  const R = RS.R, M = RS.M, key = R.key || {}, my = M.answers || {}, can = R.cancelled || [];
  const att = ATT[x.id] || {};
  $('#print').innerHTML = `<div class="ph"><img src="logo.png" alt=""><div><div style="font-weight:900;font-size:18px">${esc(NAME)}</div><div style="color:#666">${esc(TAG)}</div></div><div class="tag">RESPONSE SHEET</div></div>
    <table class="det" style="margin:8px 0"><tr><td style="color:#666">Name</td><td><b>${esc(PROFILE.name)}</b></td><td style="color:#666">State</td><td><b>${esc(PROFILE.state)}</b></td></tr>
      <tr><td style="color:#666">Exam</td><td><b>${esc(x.title)}</b></td><td style="color:#666">Date</td><td><b>${esc(fmtD(att.startedAt || x.startAt))}</b></td></tr>
      <tr><td style="color:#666">Category</td><td><b>${esc(x.category || '')}</b></td><td style="color:#666">Time taken</td><td><b>${M.mins != null ? M.mins + ' min' : '–'}</b></td></tr></table>
    <div class="cards"><div class="k"><b>${M.score}</b>Score / ${R.total}</div><div><b>${rankTxt(M.rank, R)}</b>Rank${showN(R) ? ' / ' + R.n : ''}</div><div><b>${M.acc}%</b>Accuracy</div><div><b>${M.cor} / ${M.wrong} / ${M.skip}</b>Correct / Wrong / Skipped</div></div>
    ${M.secs ? `<table class="qt2" style="margin-bottom:8px"><tr><th>Section</th><th>Correct</th><th>Wrong</th><th>Score</th></tr>${Object.keys(M.secs).map(k => `<tr><td>${esc(k)}</td><td>${M.secs[k].c}</td><td>${M.secs[k].w}</td><td>${M.secs[k].score} / ${M.secs[k].total}</td></tr>`).join('')}</table>` : ''}
    <table class="qt2"><tr><th style="width:28px">Q</th><th>Question</th><th style="width:44px">Yours</th><th style="width:50px">Correct</th><th style="width:34px">✓/✗</th></tr>
    ${P.map((q, i) => { const k = key[q.id], u = my[q.id], c = can.includes(q.id); const mk = c ? '<span>Bonus</span>' : !u ? '–' : u === k ? '<span class="g">✓</span>' : '<span class="r">✗</span>';
      return `<tr><td>${i + 1}</td><td>${esc(q.q)}<div style="color:#666;margin-top:2px">${q.o.map((o, j) => `(${'ABCD'[j]}) ${esc(o)}`).join(' &nbsp; ')}</div></td><td>${u || '–'}</td><td><b>${k || ''}</b></td><td>${mk}</td></tr>`; }).join('')}</table>
    <div class="ft"><span>${IG_HANDLE ? '📷 @' + esc(IG_HANDLE) + ' · Instagram' : esc(NAME)}</span><span>Generated ${esc(new Date().toLocaleString('en-IN'))}</span></div>`;
  const img = $('#print img'); const doPrint = () => { document.body.classList.add('printing'); setTimeout(() => { window.print(); }, 50); };
  window.onafterprint = () => document.body.classList.remove('printing');
  if (img.complete) doPrint(); else { img.onload = doPrint; img.onerror = doPrint; }
}
async function shareScore(x) {
  const R = RS.R, M = RS.M, c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const g = c.getContext('2d');
  g.fillStyle = '#FFE51F'; g.fillRect(0, 0, 1080, 1350);
  g.fillStyle = '#111318'; g.fillRect(60, 380, 960, 700);
  const logo = new Image(); logo.src = 'logo.png'; await new Promise(r => { logo.onload = r; logo.onerror = r; });
  try { g.drawImage(logo, 390, 60, 300, 300); } catch (e) {}
  g.textAlign = 'center'; g.fillStyle = '#FFE51F'; g.font = '900 54px Inter, sans-serif'; g.fillText('MY SCORE', 540, 470);
  g.fillStyle = '#fff'; g.font = '900 170px Inter, sans-serif'; g.fillText(String(M.score), 540, 660);
  g.fillStyle = '#BFC3CC'; g.font = '600 44px Inter, sans-serif'; g.fillText('out of ' + R.total, 540, 725);
  g.fillStyle = '#FFE51F'; g.font = '900 86px Inter, sans-serif'; g.fillText('Rank ' + rankTxt(M.rank, R) + (showN(R) ? ' / ' + R.n : ''), 540, 860);
  g.fillStyle = '#fff'; g.font = '700 42px Inter, sans-serif'; g.fillText('Accuracy ' + M.acc + '%', 540, 940);
  g.fillStyle = '#BFC3CC'; g.font = '600 36px Inter, sans-serif'; g.fillText(x.title.length > 44 ? x.title.slice(0, 43) + '…' : x.title, 540, 1020);
  g.fillStyle = '#111318'; g.font = '900 50px Inter, sans-serif'; g.fillText(NAME + ' · ' + TAG, 540, 1170);
  g.font = '700 40px Inter, sans-serif'; g.fillText((IG_HANDLE ? '@' + IG_HANDLE + ' · ' : '') + location.host, 540, 1240);
  c.toBlob(async b => {
    const f = new File([b], 'my-score.png', { type: 'image/png' });
    try { if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'My score', text: `I scored ${M.score}/${R.total} (Rank ${rankTxt(M.rank, R)}) in ${x.title} on ${NAME}! ${location.origin + location.pathname}` }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'IQFORU-score.png'; a.click(); toast('Score image downloaded. Share it on your Instagram story! 📸', 'ok');
  }, 'image/png');
}
