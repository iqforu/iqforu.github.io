<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IQ FOR U – Mocks for All Competitive Exams</title>
<meta name="description" content="IQ FOR U online mock tests for SSC, Railway, TET, Banking and State exams. Real CBT exam screen, negative marking, merit list, rank and response sheet.">
<meta property="og:title" content="IQ FOR U – Mocks for All Competitive Exams">
<meta property="og:description" content="Online mock tests with real CBT exam screen, merit list and response sheet.">
<meta property="og:image" content="logo.png">
<meta name="theme-color" content="#111318">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IQ FOR U">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --y:#FFE51F; --y2:#FFF6B3; --ink:#111318; --ink2:#2A2E37; --mut:#6B7280; --line:#E7E8EC; --bg:#F6F6F2; --card:#fff;
  --ok:#16A34A; --ok2:#DCFCE7; --no:#DC2626; --no2:#FEE2E2; --mk:#7C3AED; --nv:#C9CDD4; --or:#FB923C; --or2:#FFF7ED;
  --sh:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
.hide{display:none!important}
.mut{color:var(--mut)} .small{font-size:13px} .tiny{font-size:12px} .center{text-align:center}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:up .3s ease both}

/* ---------- top bar */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff}
.top .in{max-width:560px;margin:auto;display:flex;align-items:center;gap:10px;padding:9px 14px}
.top img{width:36px;height:36px;border-radius:50%}
.top .t1{font-weight:900;font-size:16px;color:var(--y);letter-spacing:.3px;line-height:1.1}
.top .t2{font-size:11.5px;color:#BFC3CC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.top .sp{flex:1}
.top .back{background:none;border:0;color:#fff;font-size:20px;padding:2px 6px 2px 0}
.top .ttl{font-weight:800;font-size:16px;color:var(--y);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrapw{max-width:560px;margin:auto;padding:12px 14px 90px}
body.adm .top .in{max-width:1000px}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--ink);background:var(--y);color:var(--ink);font-weight:800;border-radius:12px;padding:11px 16px;font-size:15px;box-shadow:0 2px 0 var(--ink);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.dk{background:var(--ink);color:var(--y)}
.btn.gh{background:#fff;border-color:var(--line);box-shadow:none}
.btn.red{background:#fff;border-color:#FCA5A5;color:var(--no);box-shadow:none}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.link{background:none;border:0;padding:0;font-weight:700;text-decoration:underline}

/* ---------- cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sec{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;margin:18px 0 9px}
.sec a,.sec button{font-size:12.5px;color:var(--mut);font-weight:700;background:none;border:0;text-decoration:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:#EEF0F3;color:#555;white-space:nowrap}
.c-free{background:var(--ok2);color:#166534} .c-paid{background:var(--y2);color:#7A5B00;border:1px solid #E8C900}
.c-live{background:var(--no2);color:#B91C1C} .c-cat{background:#EEF2FF;color:#3730A3} .c-done{background:#E0F2FE;color:#075985}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pl 1.3s infinite}
@keyframes pl{50%{opacity:.3}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:13px;font-weight:700}
.chips button.on{background:var(--ink);color:var(--y);border-color:var(--ink)}
.msg{padding:10px 12px;border-radius:10px;margin-top:10px;font-size:14px}
.msg.err{background:var(--no2);color:#991B1B} .msg.ok{background:var(--ok2);color:#14532D} .msg.info{background:var(--y2);color:#5C4600}

/* ---------- home */
.livec{background:var(--y);border:1.5px solid var(--ink);border-radius:16px;padding:14px;box-shadow:3px 3px 0 var(--ink)}
.livec h3{margin:7px 0 2px;font-size:18px;font-weight:900}
.livec .m{font-size:13px}
.livec .r{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.newc{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px dashed var(--ink);border-radius:14px;padding:12px;margin-top:12px}
.newc .e{font-size:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}
.stats b{display:block;font-size:19px;font-weight:900} .stats small{font-size:11px;color:var(--mut);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tl{position:relative;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 3px 8px;text-align:center;font-size:11.5px;font-weight:700;line-height:1.2;text-decoration:none}
.tl span{display:block;font-size:23px;margin-bottom:4px}
.tl em{position:absolute;top:-6px;right:-3px;background:var(--ink);color:var(--y);font-size:8.5px;font-style:normal;padding:1px 5px;border-radius:6px;font-weight:800}
.banner{border-radius:13px;padding:11px 12px;font-size:13.5px;margin-bottom:12px;line-height:1.45}
.banner.v{background:var(--or2);border:1.5px solid var(--or)}
.banner.n{background:var(--ink);color:#fff} .banner.n b{color:var(--y)}
.banner.b{background:var(--no2);border:1.5px solid #FCA5A5;color:#991B1B}
.ulist .it{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:8px}
.ulist .it .e{font-size:22px}
.foot{margin-top:24px;text-align:center;font-size:12.5px;color:var(--mut)}
.foot a{margin:0 5px;color:var(--mut)}

/* ---------- test cards */
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:0;background:#E9EAEE;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700}
.tabs button.on{background:var(--ink);color:var(--y)}
.xc{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:11px}
.xc.lv{border:1.5px solid var(--ink)}
.xc h3{font-size:16.5px;margin:7px 0 4px;line-height:1.3}
.xc .ds{font-size:13px;color:var(--mut);margin:0 0 4px}
.meta{display:flex;flex-wrap:wrap;gap:4px 11px;font-size:12.5px;color:var(--mut)}
.cd{display:flex;gap:5px;align-items:center;margin:9px 0}
.cd div{background:var(--ink);color:var(--y);border-radius:8px;padding:4px 8px;text-align:center;font-weight:900;font-size:16px;min-width:42px;font-variant-numeric:tabular-nums}
.cd small{display:block;font-size:8.5px;color:#BFC3CC;font-weight:700;letter-spacing:.4px}
.cd span{font-size:12px;color:var(--mut);margin-left:3px}
.empty{text-align:center;padding:30px 14px;color:var(--mut)} .empty .ic{font-size:40px}

/* ---------- bottom nav */
.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bn .in{max-width:560px;margin:auto;display:flex}
.bn button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 8px;font-size:11px;color:var(--mut);font-weight:600}
.bn button span{font-size:19px;line-height:26px;padding:0 14px;border-radius:14px}
.bn button.on{color:var(--ink);font-weight:800}
.bn button.on span{background:var(--y)}
body.inexam .bn,body.inexam #top{display:none}

/* ---------- forms */
.auth{min-height:100vh;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;padding:24px 16px 30px}
.auth .lg{width:104px;height:104px;border-radius:50%}
.auth h1{color:var(--y);margin:10px 0 0;font-size:24px;font-weight:900}
.auth .tg{color:#BFC3CC;font-size:13.5px}
.auth .box{background:#fff;color:var(--ink);border-radius:18px;padding:18px;width:100%;max-width:420px;margin-top:18px}
.auth .box h2{margin:0 0 2px;font-size:19px}
.form{max-width:460px;margin:auto}
label.l{display:block;font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 5px}
.inp,input.inp,select.inp,textarea.inp{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;font-size:15px;outline:0}
.inp:focus{border-color:var(--ink)}
.inp.good{border-color:var(--ok)} .inp.bad{border-color:var(--no)}
.mob{display:flex} .mob b{display:flex;align-items:center;border:1.5px solid var(--line);border-right:0;border-radius:11px 0 0 11px;padding:0 11px;background:#F3F4F6}
.mob input{border-radius:0 11px 11px 0}
.pw{position:relative} .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:12.5px;font-weight:700;color:var(--mut);padding:6px}
.pw input{padding-right:58px}
.hint{font-size:12px;margin-top:4px;color:var(--mut)} .hint.ok{color:var(--ok);font-weight:700} .hint.bad{color:var(--no);font-weight:700}
.or{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin:12px 0 10px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.gbtn b{color:#4285F4;font-size:17px;font-weight:900}
.note{background:var(--y2);border-radius:10px;padding:9px 11px;font-size:12.5px;margin-top:12px;line-height:1.45}

/* ---------- exam */
.xbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.xbar .in{display:flex;align-items:center;gap:8px;padding:8px 12px}
.xbar img{width:26px;height:26px;border-radius:50%}
.xbar .tt{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xbar .tt small{display:block;font-weight:500;font-size:11.5px;color:#BFC3CC}
.timer{background:var(--y);color:var(--ink);font-weight:900;border-radius:9px;padding:5px 10px;font-size:17px;font-variant-numeric:tabular-nums}
.timer.low{background:var(--no);color:#fff;animation:pl 1s infinite}
.xbar .sb{background:transparent;border:1.5px solid #555;color:#fff;border-radius:9px;padding:5px 10px;font-weight:700;font-size:13px}
.prog{height:3px;background:#2A2E37} .prog i{display:block;height:100%;background:var(--y);transition:width .3s}
.stabs{display:flex;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.stabs button{flex:none;border:0;background:#F1F2F4;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.stabs button.on{background:var(--ink);color:var(--y)}
.xmain{display:flex;max-width:1200px;margin:auto}
.xq{flex:1;min-width:0;padding:14px 14px 90px;position:relative;overflow:hidden}
.qh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-bottom:9px;gap:8px}
.qh b{color:var(--ink);font-size:14px}
.rep{background:none;border:0;font-size:12.5px;color:var(--mut);font-weight:700}
.qt{font-size:17px;font-weight:600;line-height:1.55;margin:0 0 14px;white-space:pre-wrap}
.op{display:flex;gap:11px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:11px 12px;margin-bottom:9px;font-size:15.5px}
.op i{font-style:normal;flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--nv);display:grid;place-items:center;font-size:13px;font-weight:800}
.op.sel{border-color:var(--ink);background:var(--y2)}
.op.sel i{background:var(--ink);color:var(--y);border-color:var(--ink)}
.clr{background:none;border:0;color:var(--mut);font-size:13px;font-weight:700;text-decoration:underline;display:block;margin:4px auto 0}
.ab{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.ab .in{display:flex;gap:6px;max-width:1200px;margin:auto}
.ab button{flex:1;font-size:12.5px;font-weight:800;padding:10px 3px;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.ab .mkb{border-color:var(--mk);color:var(--mk)}
.ab .nx{background:var(--ink);color:var(--y);border-color:var(--ink)}
.side{display:none}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.pq{position:relative;height:36px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:800;border:0;background:#fff;box-shadow:inset 0 0 0 1.5px var(--nv);color:var(--ink2);font-style:normal}
.pq.a{background:var(--ok);color:#fff;box-shadow:none} .pq.n{background:var(--no);color:#fff;box-shadow:none}
.pq.m{background:var(--mk);color:#fff;border-radius:50%;box-shadow:none}
.pq.am{background:var(--mk);color:#fff;border-radius:50%;box-shadow:none}
.pq.am:after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;background:var(--ok);border-radius:50%;border:2px solid #fff}
.pq.cur{outline:3px solid var(--y);outline-offset:1px}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12.5px;margin-bottom:10px}
.leg span{display:flex;align-items:center;gap:7px}
.leg .pq{width:26px;height:26px;font-size:11px;flex:none}
@media(min-width:900px){
  .side{display:block;width:300px;flex:none;border-left:1px solid var(--line);background:#fff;padding:14px;position:sticky;top:96px;height:calc(100vh - 96px);overflow:auto}
  .ab .palb{display:none}
  .xq{padding:20px 28px 90px}
  .opts2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
}
/* sheet / modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(17,19,24,.55);display:flex;align-items:flex-end;justify-content:center;animation:up .2s}
.ov.c{align-items:center;padding:16px}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.ov.c .sheet{border-radius:18px;max-width:440px}
.grab{width:40px;height:4px;background:#D4D6DB;border-radius:4px;margin:0 auto 12px}
.sum{width:100%;border-collapse:collapse;font-size:13.5px}
.sum td,.sum th{padding:7px 5px;border-bottom:1px solid var(--line);text-align:center}
.sum td:first-child,.sum th:first-child{text-align:left}
.sum th{font-size:12px}
.stars{display:flex;justify-content:center;gap:6px}
.stars button{background:none;border:0;font-size:34px;color:#D4D6DB;padding:0}
.stars button.on{color:#F5B400}
.tagc{display:flex;flex-wrap:wrap;gap:6px}
.tagc button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 11px;font-size:12.5px;font-weight:700}
.tagc button.on{background:var(--y2);border-color:#E8C900}
.tagc.one button.on{background:var(--ink);color:var(--y);border-color:var(--ink)}

/* ---------- done + result */
.done{text-align:center;padding-top:10px}
.done .ck{width:76px;height:76px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:40px;font-weight:900;margin:10px auto}
.resc{background:var(--ink);color:#fff;border-radius:16px;padding:14px;margin-top:14px;text-align:center}
.resc .d{font-size:19px;font-weight:900;color:var(--y);margin:4px 0}
.resc .cd{justify-content:center}
.resc .cd div{background:#2A2E37}
.score{background:var(--ink);color:#fff;border-radius:16px;padding:16px;text-align:center}
.score .r3{display:flex;justify-content:space-around;margin-top:8px;font-size:12px;color:#BFC3CC}
.score .r3 b{display:block;font-size:19px;color:#fff}
.score .r3 b.y{color:var(--y)}
.sbar .t{display:flex;justify-content:space-between;font-size:13.5px;margin-top:9px}
.sbar .tr{height:8px;border-radius:6px;background:#EEF0F3;overflow:hidden;margin-top:4px}
.sbar .tr i{display:block;height:100%;background:var(--ink)}
.mine{display:flex;align-items:center;gap:12px;background:var(--y);border:1.5px solid var(--ink);border-radius:14px;padding:10px 13px;margin-bottom:12px}
.mine .rk{font-size:28px;font-weight:900}
table.mt{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.mt th{background:var(--ink);color:var(--y);text-align:left;padding:8px 7px;font-size:12px}
table.mt td{padding:8px 7px;border-bottom:1px solid var(--line)}
table.mt .n{text-align:right}
table.mt tr.me td{background:var(--y2);font-weight:800}
.rv{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px}
.rv .q{font-weight:600;margin:6px 0 8px;white-space:pre-wrap}
.rv .o{border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:6px;font-size:14px}
.rv .o.c{border-color:var(--ok);background:#F0FDF4;font-weight:700}
.rv .o.w{border-color:var(--no);background:#FEF2F2}
.pf{background:var(--ink);color:#fff;text-align:center;padding:20px 14px 18px}
.pf .av{width:64px;height:64px;border-radius:50%;background:var(--y);color:var(--ink);border:2px solid #fff;display:grid;place-items:center;font-weight:900;font-size:26px;margin:0 auto}
.menu{background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:12px}
.menu button,.menu a{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 2px;font-size:14.5px;text-align:left;text-decoration:none}
.menu>:last-child{border-bottom:0}
.menu .ar{margin-left:auto;color:var(--mut)}
.doc h2{font-size:17px;margin:18px 0 6px} .doc p,.doc li{font-size:14.5px;line-height:1.6;color:var(--ink2)}

/* ---------- print (response sheet) */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body.printing>*:not(#print){display:none!important}
  body.printing #print{display:block}
  body.printing{background:#fff}
}
#print{font-size:11px;color:#111}
#print .pg+.pg{page-break-before:always;break-before:page}
#print .ph{display:flex;align-items:center;gap:10px;border-bottom:3px solid #111;padding-bottom:8px}
#print .ph img{width:52px;height:52px}
#print .ph .tag{margin-left:auto;background:#FFE51F;border:1.5px solid #111;font-weight:900;padding:4px 9px;border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#print table{width:100%;border-collapse:collapse}
#print .det td{padding:3px 4px}
#print .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
#print .cards div{border:1px solid #ccc;border-radius:6px;padding:6px;text-align:center}
#print .cards div b{display:block;font-size:16px}
#print .cards .k{background:#111;color:#FFE51F;-webkit-print-color-adjust:exact;print-color-adjust:exact}

const ic = (n, c) => (IC[n] || '').replace('<svg ', '<svg class="ic' + (c ? ' ' + c : '') + '" ');
const BOOKS = '<svg class="bk" viewBox="0 0 120 90" aria-hidden="true"><rect x="18" y="62" width="88" height="14" rx="3" fill="#FACC15"/><rect x="24" y="64" width="76" height="2" fill="#fff" opacity=".7"/><rect x="10" y="46" width="90" height="14" rx="3" fill="#E2E8F0"/><rect x="16" y="48" width="78" height="2" fill="#94A3B8"/><rect x="22" y="30" width="80" height="14" rx="3" fill="#6366F1"/><rect x="28" y="32" width="68" height="2" fill="#fff" opacity=".6"/><rect x="14" y="14" width="86" height="14" rx="3" fill="#F8FAFC"/><rect x="20" y="16" width="74" height="2" fill="#CBD5E1"/><circle cx="104" cy="12" r="7" fill="#FACC15"/><path d="M101 12l2 2 4-4" stroke="#0F172A" stroke-width="1.6" fill="none"/></svg>';
let USER = null, PROFILE = null, BLOCKED = false, EXAMS = [], ATT = {}, UNL = {}, PUB = {}, MYR = {}, PASS = null;
let NOTES = [], INSTALL = null, MSG_ON = false;
let OLDP = {}, CAT = 'All', TTAB = null, NEXT = null, REGISTERING = false, AUTH_READY = false, X = null;
const PAPER = {};
try { CAT = localStorage.getItem('iq_cat') || 'All'; if (CAT === 'Banking') CAT = 'All'; } catch (e) {}

if (/Instagram|FBAN|FBAV|FB_IAB/i.test(navigator.userAgent)) window.__inApp = true;

// ================================================================ router
const go = h => { if (location.hash === '#/' + h) route(); else location.hash = '#/' + h; };
function needLogin(next) { NEXT = next || location.hash; go('login'); }
window.addEventListener('hashchange', () => {
  if (X && !X.done && !X.preview) { if (location.hash !== '#/exam') { history.pushState(null, '', '#/exam'); toast('Test is running. Use Submit to finish.', 'info'); } return; }
  route();
});
$$('[data-nav]').forEach(b => b.onclick = () => go(b.dataset.nav));
[['n1', 'home'], ['n2', 'tests'], ['n3', 'results'], ['n4', 'notes'], ['n5', 'profile']].forEach(([i, k]) => { const e = document.getElementById(i); if (e) e.innerHTML = ic(k); });

function setNav(k) {
  $$('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === k));
  $('#bnp').innerHTML = `<span>${ic('profile')}</span>${USER ? 'Profile' : 'Login'}`;
}
function topMain() {
  $('#topin').innerHTML = `<button class="mb" id="mnu" type="button" aria-label="Menu">${ic('menu')}</button><img src="logo.png" alt=""><div style="min-width:0"><div class="t1">${esc(NAME)}</div><div class="t2">${USER && PROFILE ? 'Hi, ' + esc(first(PROFILE.name)) : 'Mocks · Notes · PYQs'}</div></div><div class="sp"></div>
    ${USER ? (PROFILE ? `<button class="bell" id="bel" type="button" aria-label="Notifications">${ic('bell')}<b id="bellc" class="hide"></b></button><button class="avt" type="button" id="tav" aria-label="Profile">${esc((PROFILE.name || '?')[0].toUpperCase())}</button>` : '') : '<button class="btn sm dk" id="tl" type="button">Login</button>'}`;
  if ($('#tl')) $('#tl').onclick = () => go('login');
  $('#mnu').onclick = drawer; if ($('#tav')) $('#tav').onclick = () => go('profile');
  if ($('#bel')) { $('#bel').onclick = () => go('inbox'); bell(); }
}
function topBack(title, back) {
  $('#topin').innerHTML = `<button class="back" id="tb" type="button" aria-label="Back">${ic('back')}</button><div class="ttl">${esc(title)}</div>`;
  $('#tb').onclick = () => back ? go(back) : (history.length > 1 ? history.back() : go('home'));
}
function shell(html, nav) {
  document.body.classList.remove('inexam', 'adm');
  $('#top').classList.remove('hide'); $('#bn').classList.toggle('hide', !nav);
  if (nav) setNav(nav);
  $('#app').innerHTML = html; window.scrollTo(0, 0);
}

async function route() {
  if (!AUTH_READY) return;
  if (X && X.preview) stopExam();
  const h = (location.hash || '#/home').replace(/^#\/?/, ''), [v, a, b] = h.split('/');
  if (USER && !PROFILE && !['complete', 'page', 'admin'].includes(v)) return go('complete');
  switch (v) {
    case '': case 'home': return home();
    case 'tests': return tests();
    case 'practice': return practice(a, b);
    case 'pstart': return USER ? pInstr(a) : needLogin('#/pstart/' + a);
    case 'presult': return USER ? pResult(a, b) : needLogin('#/presult/' + a);
    case 'ptop': return USER ? pTop(a) : needLogin('#/ptop/' + a);
    case 'presults': return USER ? results(null, 'practice') : needLogin('#/presults');
    case 'results': return USER ? results(a) : needLogin('#/results');
    case 'profile': return USER ? profile() : go('login');
    case 'edit': return USER ? editProfile() : go('login');
    case 'password': return USER ? changePw() : go('login');
    case 'login': return USER ? go('home') : loginView();
    case 'register': return USER ? go('home') : registerView();
    case 'forgot': return forgotView();
    case 'complete': return USER ? completeView() : go('login');
    case 'page': return pageView(a);
    case 'inbox': return USER ? inboxView() : go('login');
    case 'payments': return USER ? myPayments() : go('login');
    case 'notes': return notesView();
    case 'pass': return USER ? (profile(), buyPass()) : needLogin('#/pass');
    case 'start': return USER ? instructions(a) : needLogin('#/start/' + a);
    case 'admin': return openAdmin();
    case 'exam': { let r = null; try { r = sessionStorage.getItem('iq_run'); } catch (e) {}
      if (USER && r && r.startsWith('p:')) { const [, pid, rr] = r.split(':'); return pStart(pid, rr === 'r'); }
      return USER && r ? go('start/' + r) : go('home'); }
    default: return home();
  }
}

// ================================================================ auth state
onAuthStateChanged(auth, async u => {
  if (REGISTERING) { USER = u; return; }
  USER = u; PROFILE = null; BLOCKED = false; ATT = {}; UNL = {}; MYR = {}; PASS = null;
  if (u) {
    try { const s = await getDoc(doc(db, 'users', u.uid)); const d = s.exists() ? s.data() : null; OLDP = d || {}; PROFILE = d && d.name && d.mobile && d.state ? d : null; } catch (e) { PROFILE = null; }
    try { const b = await getDoc(doc(db, 'blocked', u.uid)); BLOCKED = b.exists(); } catch (e) {}
    await loadPass();
  }
  AUTH_READY = true;
  if (u && PROFILE && NEXT) { const n = NEXT; NEXT = null; if (location.hash === n) route(); else location.hash = n; return; }

// score a practice attempt with the answer key (same rules as live mocks)
function pScore(qs, key, ans, m, n) {
  let cor = 0, wrong = 0;
  qs.forEach(q => { const a = ans[q.id]; if (!a) return; if (a === key[q.id]) cor++; else wrong++; });
  const s = Math.round((cor * m - wrong * n) * 100) / 100;
  return { s, t: Math.round(qs.length * m * 100) / 100, cor, wrong, skip: qs.length - cor - wrong, acc: cor + wrong ? Math.round(cor / (cor + wrong) * 1000) / 10 : 0 };
}

  let ok = false, lastErr = null;
  for (let i = 0; i < 3 && !ok; i++) {

    catch (e) { lastErr = e; if ((e.code || '').includes('permission')) break; await new Promise(r => setTimeout(r, 1500)); }

// 📈 small line graph (values in %), labels under the points
function lineSvg(P, color) {
  const W = 320, H = 130, l = 30, r = 10, t = 12, b = 26, n = P.length, X = i => l + (n === 1 ? (W - l - r) / 2 : i * (W - l - r) / (n - 1)), Y = v => t + (100 - Math.max(0, Math.min(100, v))) * (H - t - b) / 100;
  const grid = [0, 50, 100].map(v => `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E7E8EC"/><text x="${l - 5}" y="${Y(v) + 3}" text-anchor="end" font-size="9" fill="#6B7280">${v}%</text>`).join('');
  const pts = P.map((p, i) => `${X(i)},${Y(p.v)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress graph">${grid}${n > 1 ? `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>` : ''}
    ${P.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="4" fill="${color}"/><text x="${X(i)}" y="${Y(p.v) - 7}" text-anchor="middle" font-size="9" font-weight="700" fill="#111318">${Math.round(p.v)}</text><text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="8.5" fill="#6B7280">${esc(p.l)}</text>`).join('')}</svg>`;
}

    <div class="cards"><div class="k"><b>${M.score}</b>Score / ${R.total}</div><div><b>${showRank}</b>Rank${showN(R) ? ' / ' + R.n : ''}</div><div><b>${M.acc}%</b>Accuracy</div><div><b>${M.cor} / ${M.wrong} / ${M.skip}</b>Correct / Wrong / Skipped</div></div>
    ${M.secs ? `<table class="qt2" style="margin-bottom:8px"><tr><th>Section</th><th>Correct</th><th>Wrong</th><th>Score</th></tr>${Object.keys(M.secs).map(k => `<tr><td>${esc(k)}</td><td>${M.secs[k].c}</td><td>${M.secs[k].w}</td><td>${M.secs[k].score} / ${M.secs[k].total}</td></tr>`).join('')}</table>` : ''}
    <table class="qt2"><tr><th style="width:28px">Q</th><th>Question</th><th style="width:44px">Yours</th><th style="width:50px">Correct</th><th style="width:34px">✓/✗</th></tr>
    ${P.map((q, i) => { const k = key[q.id], u = my[q.id], c = can.includes(q.id); const mk = c ? '<span>Bonus</span>' : !u ? '–' : u === k ? '<span class="g">✓</span>' : '<span class="r">✗</span>';
      return `<tr><td>${i + 1}</td><td>${esc(q.q)}<div style="color:#666;margin-top:2px">${q.o.map((o, j) => `(${'ABCD'[j]}) ${esc(o)}`).join(' &nbsp; ')}</div></td><td>${showL(q, u) || '–'}</td><td><b>${showL(q, k) || ''}</b></td><td>${mk}</td></tr>`; }).join('')}</table>
    <div class="ft"><span>${IG_HANDLE ? '📷 @' + esc(IG_HANDLE) + ' · Instagram' : esc(NAME)}</span><span>Generated ${esc(new Date().toLocaleString('en-IN'))}</span></div></div>`;
}
function printSheets(pages) {
  $('#print').innerHTML = pages.join('');
  const img = $('#print img'); const doPrint = () => { document.body.classList.add('printing'); setTimeout(() => { window.print(); }, 50); };
  window.onafterprint = () => document.body.classList.remove('printing');
  if (!img || img.complete) doPrint(); else { img.onload = doPrint; img.onerror = doPrint; }
}
async function shareScore(x) {
  const R = RS.R, M = RS.M, c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const g = c.getContext('2d');
  g.fillStyle = '#FFE51F'; g.fillRect(0, 0, 1080, 1350);
  g.fillStyle = '#111318'; g.fillRect(60, 380, 960, 700);
  const logo = new Image(); logo.src = 'logo.png'; await new Promise(r => { logo.onload = r; logo.onerror = r; });
  try { g.drawImage(logo, 390, 60, 300, 300); } catch (e) {}
  g.textAlign = 'center'; g.fillStyle = '#FFE51F'; g.font = '900 54px Inter, sans-serif'; g.fillText('MY SCORE', 540, 470);
  g.fillStyle = '#fff'; g.font = '900 170px Inter, sans-serif'; g.fillText(String(M.score), 540, 660);
  g.fillStyle = '#BFC3CC'; g.font = '600 44px Inter, sans-serif'; g.fillText('out of ' + R.total, 540, 725);
  g.fillStyle = '#FFE51F'; g.font = '900 86px Inter, sans-serif'; g.fillText('Rank ' + rankTxt(M.rank, R) + (showN(R) ? ' / ' + R.n : ''), 540, 860);
  g.fillStyle = '#fff'; g.font = '700 42px Inter, sans-serif'; g.fillText('Accuracy ' + M.acc + '%', 540, 940);
  g.fillStyle = '#BFC3CC'; g.font = '600 36px Inter, sans-serif'; g.fillText(x.title.length > 44 ? x.title.slice(0, 43) + '…' : x.title, 540, 1020);
  g.fillStyle = '#111318'; g.font = '900 50px Inter, sans-serif'; g.fillText(NAME + ' · ' + TAG, 540, 1170);
  g.font = '700 40px Inter, sans-serif'; g.fillText((IG_HANDLE ? '@' + IG_HANDLE + ' · ' : '') + location.host, 540, 1240);
  c.toBlob(async b => {
    const f = new File([b], 'my-score.png', { type: 'image/png' });
    try { if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'My score', text: `I scored ${M.score}/${R.total} (Rank ${rankTxt(M.rank, R)}) in ${x.title} on ${NAME}! ${location.origin + location.pathname}` }); return; } } catch (e) { if (e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'IQFORU-score.png'; a.click(); toast('Score image downloaded. Share it on your Instagram story! 📸', 'ok');
  }, 'image/png');
}
